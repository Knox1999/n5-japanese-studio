            function installOverviewOverride() {
              window.renderOverview = renderPremiumOverview;
              renderPremiumOverview();
            }
          
            function addSrsHealthPanel() {
              const root = q("#view-srs");
              if (!root || q(".v40-srs-insight",root)) return;
              if (state?.srsSession) return;
              const x = currentLessonStats();
              const global = srsHealth();
              const anchor = q(".stats",root) || q(".srs-actions",root);
              if (!anchor) return;
              anchor.insertAdjacentHTML("afterend",`<section class="v40-srs-insight">
                <div><span>MEMORY HEALTH · L${String(x.lesson).padStart(2,"0")}</span><h3>Review pressure vs long-term memory</h3></div>
                <div class="v40-srs-mini-grid">
                  <div><b>${x.srs.due || 0}</b><span>Due now</span></div><div><b>${x.srs.new || 0}</b><span>New</span></div><div><b>${x.srs.mature || 0}</b><span>Mature in lesson</span></div><div><b>${global.mature}</b><span>Mature overall</span></div>
                </div>
              </section>`);
            }
          
            function wrapSRS() {
              if (typeof window.renderSRS !== "function") return;
              const prev = window.renderSRS;
              window.renderSRS = function(...args) {
                const out = prev.apply(this,args);
                requestAnimationFrame(addSrsHealthPanel);
                return out;
              };
              addSrsHealthPanel();
            }
          
            function mockBreakdownHTML(review) {
              const groups = new Map();
              for (const qn of review || []) {
                const key = String(qn.type || "Other");
                const g = groups.get(key) || {total:0,correct:0};
                g.total += 1; if (qn.is_correct) g.correct += 1; groups.set(key,g);
              }
              return [...groups.entries()].sort((a,b)=>b[1].total-a[1].total).slice(0,8).map(([name,g])=>{
                const pct = g.total ? Math.round(g.correct*100/g.total) : 0;
                return `<div class="v40-break-row"><div><span>${esc40(name)}</span><b>${pct}%</b></div><div><i style="width:${pct}%"></i></div></div>`;
              }).join("") || `<div class="v40-no-data">No category data.</div>`;
            }
          
            function addMockAnalytics() {
              const root = q("#view-mock");
              if (!root || q(".v40-mock-analytics",root) || !state?.result) return;
              const r = state.result;
              const history = mockHealth();
              const title = q(".exam-title",root);
              if (!title) return;
              title.insertAdjacentHTML("afterend",`<section class="v40-mock-analytics">
                <article class="v40-mock-score">${ringSVG(r.score,"Score")}<div><span>CORRECT</span><b>${r.correct}/${r.total}</b><small>${r.wrong} wrong · ${r.unanswered} unanswered</small></div></article>
                <article class="v40-mock-breakdown"><div class="v40-panel-head"><div><span>QUESTION TYPE ACCURACY</span><h3>Where you performed best</h3></div></div>${mockBreakdownHTML(r.review)}</article>
                <article class="v40-mock-history"><div class="v40-panel-head"><div><span>RECENT TREND</span><h3>Mock progression</h3></div></div>${sparklineSVG(history.history.slice().reverse().map(x=>x.score),"Mock trend")}</article>
              </section>`);
            }
          
            function wrapMockReview() {
              if (typeof window.renderReview === "function") {
                const prev = window.renderReview;
                window.renderReview = function(...args){ const out = prev.apply(this,args); requestAnimationFrame(addMockAnalytics); return out; };
                addMockAnalytics();
              }
              if (typeof window.renderHistory === "function") {
                const prevH = window.renderHistory;
                window.renderHistory = function(...args){
                  const out = prevH.apply(this,args);
                  requestAnimationFrame(()=>{
                    const root=q("#view-history"); if(!root||q(".v40-history-trend",root)) return;
                    const h=mockHealth(); const head=q(".section-head",root); if(!head) return;
                    head.insertAdjacentHTML("afterend",`<section class="v40-history-trend"><div><span>PERFORMANCE TREND</span><h3>${h.attempts ? `${h.attempts} saved attempts` : "Your first trend will appear here"}</h3></div>${sparklineSVG(h.history.slice().reverse().map(x=>x.score),"Saved mock scores")}</section>`);
                  });
                  return out;
                };
              }
            }
          
            function refineListening() {
              if (typeof window.renderListening !== "function") return;
              const prev = window.renderListening;
              window.renderListening = function(...args) {
                const out = prev.apply(this,args);
                requestAnimationFrame(()=>{
                  const root = q("#view-listening"); if(!root) return;
                  ["#l125","#l15","#l2","#l3"].forEach(id=>q(id,root)?.remove());
                  const rate = q("#rate");
                  if (rate) { rate.max = "1.00"; if (Number(rate.value)>1) {rate.value="1.00"; q("#rateValue") && (q("#rateValue").textContent="1.00×");} }
                  const speeds = q(".listen-speeds",root);
                  if (speeds && !q(".v40-speed-cap",root)) speeds.insertAdjacentHTML("afterend",`<div class="v40-speed-cap"><span>Natural listening range</span><b>0.75× · 0.90× · 1×</b></div>`);
                  const stage = q(".enhanced-stage,.listen-stage",root);
                  if (stage && !q(".v40-player-badge",stage)) stage.insertAdjacentHTML("afterbegin",`<div class="v40-player-badge"><span class="dot"></span> Expressive neural Japanese · single stream</div>`);
                });
                return out;
              };
            }
          
          
          
            let strokeIndexPromise = null;
            function strokeIndex() {
              if (!strokeIndexPromise) {
                strokeIndexPromise = fetch("./assets/strokes/index.json", {cache:"force-cache"})
                  .then(r => r.ok ? r.json() : Promise.reject(new Error(`Stroke index HTTP ${r.status}`)))
                  .catch(err => { strokeIndexPromise = null; throw err; });
              }
              return strokeIndexPromise;
            }
          
            async function renderStrokeOrder(character, mount) {
              if (!mount || !character) return;
              mount.innerHTML = `<div class="v40-stroke-loading"><span></span><b>Loading stroke order…</b></div>`;
              try {
                const index = await strokeIndex();
                const filename = index[String(character)] || null;
                if (!filename) {
                  mount.innerHTML = `<div class="v40-stroke-empty">এই Kanji-এর KanjiVG stroke file এই build-এ পাওয়া যায়নি।</div>`;
                  return;
                }
                const res = await fetch(`./assets/strokes/${filename}`, {cache:"force-cache"});
                if (!res.ok) throw new Error(`Stroke SVG HTTP ${res.status}`);
                const raw = await res.text();
                const doc = new DOMParser().parseFromString(raw, "image/svg+xml");
                const svg = doc.documentElement;
                svg.removeAttribute("width"); svg.removeAttribute("height");
                svg.classList.add("v40-stroke-svg");
                svg.setAttribute("role","img");
                svg.setAttribute("aria-label",`${character} stroke order`);
                mount.replaceChildren(svg);
          
                const paths = [...svg.querySelectorAll("path")].filter(p => {
                  try { return p.getTotalLength() > 1; } catch { return false; }
                });
                const numbers = [...svg.querySelectorAll("text")];
                numbers.forEach(t => t.classList.add("v40-stroke-number"));
          
                const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
                const replay = () => {
                  paths.forEach(p => { try { p.getAnimations().forEach(a=>a.cancel()); } catch {} });
                  if (reduce) {
                    paths.forEach(p => { p.style.strokeDasharray=""; p.style.strokeDashoffset=""; });
                    return;
                  }
                  paths.forEach((p,i) => {
                    const len = p.getTotalLength();
                    p.style.fill = "none";
                    p.style.stroke = "#17364b";
                    p.style.strokeWidth = "3.4";
                    p.style.strokeLinecap = "round";
                    p.style.strokeLinejoin = "round";
                    p.style.strokeDasharray = String(len);
                    p.style.strokeDashoffset = String(len);
                    p.animate(
                      [{strokeDashoffset:len},{strokeDashoffset:0}],
                      {duration:460,easing:"cubic-bezier(.3,.7,.2,1)",delay:i*360,fill:"forwards"}
                    );
                  });
                };
                replay();
                const btn = q("#v40StrokeReplay"); if (btn) btn.onclick = replay;
              } catch (err) {
                mount.innerHTML = `<div class="v40-stroke-empty">Stroke order load হয়নি। আবার page reload করে দেখুন।</div>`;
                console.warn("v40 stroke order:", err);
              }
            }
          
            function installStrokeOrderPanel() {
              const root = q("#view-kanji");
              const detail = q("#klcDetail", root);
              const selected = (()=>{try{return state?.klcSelected?.kanji || "";}catch{return "";}})();
              if (!root || !detail || !selected) return;
              let panel = q("#v40StrokePanel", detail);
              if (!panel) {
                detail.insertAdjacentHTML("beforeend",`<section class="v40-stroke-panel" id="v40StrokePanel">
                  <div class="v40-stroke-head"><div><span>STROKE ORDER</span><h3>Write ${esc40(selected)} in the correct sequence</h3><p>Vector stroke data: KanjiVG · CC BY-SA 3.0</p></div><button type="button" class="v40-btn secondary" id="v40StrokeReplay">Replay</button></div>
                  <div class="v40-stroke-stage" id="v40StrokeStage"></div>
                </section>`);
                panel = q("#v40StrokePanel", detail);
              } else {
                const h = q("h3",panel); if(h) h.textContent=`Write ${selected} in the correct sequence`;
              }
              renderStrokeOrder(selected, q("#v40StrokeStage",panel));
            }
          
            function refineKanji() {
              if (typeof window.renderKanji !== "function") return;
              const prev = window.renderKanji;
              window.renderKanji = function(...args) {
                const out = prev.apply(this,args);
                requestAnimationFrame(()=>{
                  const root=q("#view-kanji"); if(!root) return;
                  q(".klc-page-hero",root)?.classList.add("v40-kanji-hero");
                  q(".klc-component-grid",root)?.classList.add("v40-tree-grid");
                  q(".klc-build-grid",root)?.classList.add("v40-tree-grid");
                  installStrokeOrderPanel();
                });
                return out;
              };
            }
          
            function installGlobalPolish() {
              document.documentElement.style.setProperty("--v40-ready","1");
              // Prevent old speed ranges from exposing >1× on initial load.
              const rate=q("#rate"); if(rate){rate.max="1.00"; if(Number(rate.value)>1) rate.value="1.00";}
          
              // Accessible skip link for keyboard users.
              if(!q("#v40Skip")){
                const a=document.createElement("a"); a.id="v40Skip"; a.className="v40-skip"; a.href="#view-overview"; a.textContent="Skip to study content"; document.body.prepend(a);
              }
            }
          
            function wrapLessonUpdates() {
              try {
                const prev = window.setLesson;
                if (typeof prev === "function") {
                  window.setLesson = function(...args) {
                    const out = prev.apply(this,args);
                    setTimeout(()=>{ if (state?.view === "overview") renderPremiumOverview(); },0);
                    return out;
                  };
                }
              } catch {}
            }
          
            installGlobalPolish();
            refineListening();
            refineKanji();
            wrapSRS();
            wrapMockReview();
            wrapLessonUpdates();
            installOverviewOverride();
          
            console.info("N5 Top Notch Product UI v40 loaded — real-data visualizations, mobile-first production layer.");
          })();
          JAVASCRIPT

          node --check _build/v40/top-notch-v40.js
          echo "v40 UI assets built"

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -e

          cp index.html _site/index.html
          cp index.html _site/404.html
          cp .nojekyll _site/.nojekyll 2>/dev/null || true

          cp _build/audio-manifest.js _site/audio-manifest-v30.js
          cp _build/instant-audio-v32.js _site/instant-audio-v32.js
          cp _build/app-clean-v32.js _site/app-clean-v32.js
          cp _build/analytics-events-v32.js _site/analytics-events-v32.js
          cp _build/calm-premium-ui-v34.js _site/calm-premium-ui-v34.js
          cp _build/production-premium-ui-v36.js _site/production-premium-ui-v36.js
          mkdir -p _site/assets/v40
          cp _build/v40/top-notch-v40.css _site/assets/v40/top-notch-v40.css
          cp _build/v40/top-notch-v40.js _site/assets/v40/top-notch-v40.js

          # Copy only generated MP3 files — no neural model ships to the phone.
          cp _audio_cache/*.mp3 _site/audio/

          python - <<'PYTHON'
          from pathlib import Path

          for filename in ["_site/index.html", "_site/404.html"]:
              path = Path(filename)
              html = path.read_text(encoding="utf-8")

              injection = """
              <script src="./audio-manifest-v30.js"></script>
              <script src="./instant-audio-v32.js"></script>
              <script src="./app-clean-v32.js"></script>
              <script src="./analytics-events-v32.js"></script>
              <script src="./calm-premium-ui-v34.js"></script>
              <script src="./production-premium-ui-v36.js"></script>
              <link rel="stylesheet" href="./assets/v40/top-notch-v40.css?v=40">
              <script src="./assets/v40/top-notch-v40.js?v=40"></script>
              """

              if "top-notch-v40.js" not in html or "production-premium-ui-v36.js" not in html or "calm-premium-ui-v34.js" not in html or "analytics-events-v32.js" not in html or "instant-audio-v32.js" not in html or "app-clean-v32.js" not in html:
                  html = html.replace("</body>", injection + "\n</body>")

              ga_tag = """
              <!-- Google tag (gtag.js) -->
              <script async src="https://www.googletagmanager.com/gtag/js?id=G-FG3JCWGSPR"></script>
              <script>
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-FG3JCWGSPR');
              </script>
              """
              if "G-FG3JCWGSPR" not in html:
                  html = html.replace("<head>", "<head>\n" + ga_tag, 1)

              html = html.replace(
                  "GitHub Single File · Mobile First · Romaji→Kana",
                  "Top Notch v40 · Learning Intelligence · Natural Audio · Mobile First"
              )
              html = html.replace(
                  "<title>N5 Natural Japanese Studio — GitHub Single File</title>",
                  "<title>N5 Natural Japanese Studio — Top Notch Product v40</title>"
              )

              path.write_text(html, encoding="utf-8")
          PYTHON

