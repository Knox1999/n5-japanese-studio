          html{background:var(--v40-paper);scroll-behavior:smooth}
          html,body{max-width:100%;overflow-x:clip}
          body{background:
            radial-gradient(circle at 15% 0%,rgba(217,127,144,.055),transparent 26rem),
            radial-gradient(circle at 95% 14%,rgba(85,122,159,.055),transparent 30rem),
            var(--v40-paper)!important;color:var(--v40-ink)!important;
            text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
          img,svg,video,canvas,iframe{max-inline-size:100%;block-size:auto}
          button,input,select,textarea{font:inherit}
          button,.btn,.icon,.option,.v40-action-card,.v40-heat-cell{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
          .main,.view,.card,.vocab-card,.listen-grid,.enhanced-listen-grid,.klc-detail,.exam-shell>*{min-width:0}
          
          .v40-skip{position:absolute;left:12px;top:-80px;z-index:99999;padding:10px 14px;background:var(--v40-navy);color:#fff;border-radius:10px;text-decoration:none;transition:top .15s ease}
          .v40-skip:focus{top:12px}
          
          /* ---------- Global product shell ---------- */
          .layout{grid-template-columns:256px minmax(0,1fr)!important;max-width:none!important;background:transparent!important}
          .main{width:100%;max-width:1480px!important;padding:30px 34px 84px!important;margin:0 auto!important}
          .topbar{min-height:68px!important;background:rgba(255,253,250,.93)!important;border-bottom:1px solid rgba(218,214,206,.9)!important;box-shadow:0 4px 18px rgba(20,38,56,.035)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
          .sidebar{background:linear-gradient(180deg,#0d2236 0%,#102b43 52%,#173a54 100%)!important;box-shadow:12px 0 30px rgba(16,40,63,.065)!important;border-right:0!important}
          .sidebar:after{content:"";position:absolute;inset:auto 0 0 0;height:180px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,255,255,.025))}
          .sidebar .nav button{border-radius:12px!important;min-height:44px!important;transition:background .18s var(--v40-ease),color .18s var(--v40-ease),transform .18s var(--v40-ease)!important}
          .sidebar .nav button:hover{transform:translateX(2px)}
          .sidebar .nav button.active{box-shadow:inset 3px 0 0 #e2a64e!important;background:rgba(255,255,255,.105)!important}
          .sidebar .side-section{border-color:rgba(255,255,255,.075)!important}
          .sidebar .select{min-height:44px!important}
          
          /* ---------- Hero ---------- */
          .v40-hero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,.92fr) minmax(390px,1.08fr);min-height:360px;overflow:hidden;border:1px solid #e8e0d7;border-radius:var(--v40-r-xl);background:linear-gradient(135deg,#fffdfa 0%,#fcf8f1 58%,#f2eee7 100%);box-shadow:var(--v40-shadow-2);margin-bottom:18px}
          .v40-hero:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#5c4b43 .45px,transparent .45px);background-size:8px 8px;mix-blend-mode:multiply}
          .v40-hero-copy{position:relative;z-index:3;padding:42px 0 40px 42px;display:flex;flex-direction:column;justify-content:center;min-width:0}
          .v40-brand-line{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:#8b655d;font-size:10px;font-weight:800;letter-spacing:.13em}
          .v40-seal{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--v40-red);color:#fff;font-size:16px;line-height:1;box-shadow:0 7px 18px rgba(185,71,77,.19);letter-spacing:0}
          .v40-hero h1{margin:0!important;color:var(--v40-ink)!important;font-size:clamp(36px,4.2vw,62px)!important;line-height:1.02!important;font-weight:760!important;letter-spacing:-.055em!important}
          .v40-hero p{max-width:620px;margin:15px 0 0;color:var(--v40-muted);font-size:14px;line-height:1.75}
          .v40-hero p strong{color:var(--v40-ink-2);font-weight:750}.v40-hero p span{color:var(--v40-muted)}
          .v40-hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
          .v40-btn{min-height:46px;border-radius:13px;padding:0 16px;border:1px solid transparent;font-size:12px;font-weight:780;cursor:pointer;transition:transform .16s var(--v40-ease),box-shadow .16s var(--v40-ease),background .16s ease}
          .v40-btn:hover{transform:translateY(-1px)}.v40-btn:active{transform:translateY(0) scale(.985)}
          .v40-btn.primary{background:linear-gradient(180deg,#c55257,#ad3f45);color:#fff;box-shadow:0 10px 22px rgba(185,71,77,.2)}
          .v40-btn.primary:hover{box-shadow:0 13px 28px rgba(185,71,77,.25)}
          .v40-btn.secondary{background:#fff;color:var(--v40-ink);border-color:var(--v40-line);box-shadow:var(--v40-shadow-1)}
          .v40-btn.ghost{background:transparent;color:var(--v40-blue);border-color:#d8e3eb}
          .v40-hero-meta{display:flex;flex-wrap:wrap;gap:8px 15px;margin-top:20px;color:#81909b;font-size:10px}.v40-hero-meta b{color:#40596b;font-size:11px}
          .v40-hero-visual{position:relative;min-width:0;display:flex;align-items:stretch;justify-content:flex-end;overflow:hidden}
          .v40-hero-art{width:100%;height:100%;min-height:360px;object-fit:cover;display:block;filter:saturate(.94) contrast(.99)}
          
          /* ---------- Section language ---------- */
          .v40-section{margin-top:28px}
          .v40-section-head,.v40-panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px}
          .v40-section-head{margin-bottom:12px}.v40-section-head>div:first-child,.v40-panel-head>div:first-child{min-width:0}
          .v40-section-head span,.v40-panel-head span{display:block;color:#8a7772;font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
          .v40-section-head h2,.v40-panel-head h2,.v40-panel-head h3{color:var(--v40-ink)!important;margin:4px 0 0!important;letter-spacing:-.025em!important}
          .v40-section-head h2{font-size:22px!important}.v40-section-head p{margin:5px 0 0;color:var(--v40-muted);font-size:11px;line-height:1.55}
          .v40-panel-head h2{font-size:18px!important}.v40-panel-head h3{font-size:15px!important}.v40-panel-head em{font-style:normal;font-size:9px;color:#87939c;background:#f4f4f1;border:1px solid #e8e6df;padding:5px 8px;border-radius:999px;white-space:nowrap}
          .v40-link{border:0;background:transparent;color:var(--v40-red);font-size:11px;font-weight:800;cursor:pointer;min-height:40px;padding:0 2px}
          
          /* ---------- Learning intelligence ---------- */
          .v40-intelligence-grid{display:grid;grid-template-columns:1.15fr .95fr .95fr;gap:12px;margin-top:12px}
          .v40-panel{background:rgba(255,253,250,.96);border:1px solid var(--v40-line);border-radius:21px;padding:18px;box-shadow:var(--v40-shadow-1);min-width:0}
          .v40-overall-body{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;margin-top:13px}
          .v40-ring{width:142px;height:142px;overflow:visible}.v40-ring-track,.v40-ring-value{fill:none;stroke-width:10}.v40-ring-track{stroke:#edf0ed}.v40-ring-value{stroke:var(--v40-red);stroke-linecap:round;transform:rotate(-90deg);transform-origin:66px 66px;filter:drop-shadow(0 3px 5px rgba(185,71,77,.14));transition:stroke-dasharray .6s var(--v40-ease)}
          .v40-ring-number{font-size:23px;font-weight:820;fill:var(--v40-ink)}.v40-ring-label{font-size:8px;font-weight:720;letter-spacing:.1em;text-transform:uppercase;fill:#81909a}
          .v40-metric-stack{display:grid;gap:0}.v40-metric-stack>div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #efede8;align-items:center}.v40-metric-stack>div:last-child{border-bottom:0}.v40-metric-stack span{font-size:10px;color:var(--v40-muted)}.v40-metric-stack b{font-size:12px;color:var(--v40-ink);white-space:nowrap}
          .v40-health-bars{display:grid;gap:9px;margin-top:17px}.v40-health-row>div:first-child{display:flex;justify-content:space-between;gap:12px;align-items:center}.v40-health-row span{font-size:10px;color:var(--v40-muted)}.v40-health-row b{font-size:10px;color:var(--v40-ink)}.v40-health-track{height:6px;border-radius:99px;background:#edf0ed;overflow:hidden;margin-top:5px}.v40-health-track i{display:block;height:100%;border-radius:99px;min-width:0;transition:width .45s var(--v40-ease)}.v40-health-track .danger{background:#bd5559}.v40-health-track .learning{background:#8a79a5}.v40-health-track .growing{background:#6f91b0}.v40-health-track .mature{background:#5c826d}.v40-health-track .fresh{background:#c9c6bd}
          .v40-spark{display:block;width:100%;height:98px;margin-top:15px;overflow:visible}.v40-spark-line{fill:none;stroke:var(--v40-blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.v40-spark circle{fill:#fff;stroke:var(--v40-blue);stroke-width:2}.v40-spark-guide{stroke:#dfe6e9;stroke-width:1;stroke-dasharray:4 5}.v40-trend-foot{display:flex;gap:18px;margin-top:2px;font-size:10px;color:var(--v40-muted)}.v40-trend-foot b{color:var(--v40-ink)}.v40-no-data{margin-top:17px;border:1px dashed #dfe1dc;border-radius:13px;padding:18px;color:#8a969e;font-size:10px;text-align:center;background:#fbfbf8}
          
          /* ---------- Mastery heatmap ---------- */
          .v40-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:8px;color:#7d898f}.v40-legend i{width:10px;height:10px;border-radius:3px;border:1px solid rgba(50,60,65,.08)}.v40-legend .l0{background:#f0efeb}.v40-legend .l1{background:#f7e2e4}.v40-legend .l2{background:#eab5bc}.v40-legend .l3{background:#cd7a86}.v40-legend .l4{background:#a9444b}
          .v40-heatmap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
          .v40-heat-cell{position:relative;overflow:hidden;min-height:82px;padding:12px;border:1px solid var(--v40-line);border-radius:15px;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(20,38,56,.025);transition:transform .16s var(--v40-ease),box-shadow .16s var(--v40-ease),border-color .16s ease;background:#fff}
          .v40-heat-cell:hover{transform:translateY(-1px);box-shadow:var(--v40-shadow-1)}.v40-heat-cell.current{box-shadow:0 0 0 2px rgba(185,71,77,.12),var(--v40-shadow-1);border-color:#dba6a9}
          .v40-heat-cell span{display:block;color:#7e8a92;font-size:8px;font-weight:850;letter-spacing:.08em}.v40-heat-cell b{display:block;margin-top:7px;color:var(--v40-ink);font-size:17px}.v40-heat-cell i{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--cell-accent) var(--p),#e9ebe7 var(--p));box-shadow:inset 0 0 0 1px rgba(20,38,56,.02)}
          .v40-heat-cell.level-0{--cell-accent:#c9c7c0;background:#fff}.v40-heat-cell.level-1{--cell-accent:#dc9da5;background:#fffafb}.v40-heat-cell.level-2{--cell-accent:#cc7682;background:#fff7f8}.v40-heat-cell.level-3{--cell-accent:#b8565e;background:#fff4f4}.v40-heat-cell.level-4{--cell-accent:#974048;background:#fff1f1}
          
          /* ---------- Continue cards ---------- */
          .v40-action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
          .v40-action-card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;min-height:210px;padding:18px;border:1px solid var(--v40-line);border-radius:20px;background:#fff;text-align:left;cursor:pointer;box-shadow:var(--v40-shadow-1);transition:transform .18s var(--v40-ease),box-shadow .18s var(--v40-ease),border-color .18s ease;color:var(--v40-ink)}
          .v40-action-card:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-36px;top:-40px;background:var(--card-halo);opacity:.65;pointer-events:none}
          .v40-action-card:hover{transform:translateY(-2px);box-shadow:var(--v40-shadow-2);border-color:#d9d5cd}.v40-action-card:active{transform:translateY(0)}
          .v40-action-card.lesson{--card-halo:#f8dfe2;background:linear-gradient(145deg,#fff8f7,#fff)}.v40-action-card.recall{--card-halo:#e7e0f4;background:linear-gradient(145deg,#faf8ff,#fff)}.v40-action-card.listening{--card-halo:#dcebf4;background:linear-gradient(145deg,#f7fbff,#fff)}.v40-action-card.kanji{--card-halo:#dfeee6;background:linear-gradient(145deg,#f6fbf8,#fff)}
          .v40-action-icon{position:relative;z-index:1;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.82);border:1px solid rgba(20,38,56,.07);font-size:20px;box-shadow:0 7px 16px rgba(20,38,56,.045)}
          .v40-action-card>div{position:relative;z-index:1;margin-top:15px;min-width:0}.v40-action-card small{display:block;color:#8b7570;font-size:8px;font-weight:850;letter-spacing:.13em}.v40-action-card h3{margin:5px 0 5px!important;color:var(--v40-ink)!important;font-size:17px!important;letter-spacing:-.02em}.v40-action-card p{margin:0;color:var(--v40-muted);font-size:10px;line-height:1.55}.v40-action-card>b{position:relative;z-index:1;margin-top:auto;padding-top:16px;color:#596f7e;font-size:10px}.v40-progress{height:5px;background:#eceeeb;border-radius:999px;margin-top:12px;overflow:hidden}.v40-progress i{display:block;height:100%;background:var(--v40-red);border-radius:999px}
          .v40-mini-wave{display:flex;gap:3px;height:22px;align-items:center;margin-top:11px}.v40-mini-wave i{width:3px;border-radius:3px;background:#79a3ba;height:8px}.v40-mini-wave i:nth-child(2n){height:14px}.v40-mini-wave i:nth-child(3n){height:20px}.v40-mini-wave i:nth-child(5n){height:11px}
          
          /* ---------- Achievements ---------- */
          .v40-achievement-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
          .v40-achievement{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:82px;padding:13px 14px;border:1px solid var(--v40-line);border-radius:17px;background:#fff;box-shadow:0 4px 12px rgba(20,38,56,.025)}
          .v40-achievement-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid #e1ddd4;background:#f7f4ed;color:#928477;font-size:13px;font-weight:850}.v40-achievement h3{margin:0!important;font-size:13px!important;color:var(--v40-ink)!important}.v40-achievement p{margin:4px 0 0;color:var(--v40-muted);font-size:9px}.v40-achievement>span{font-size:8px;font-weight:850;padding:5px 7px;border-radius:999px;background:#f0f0ed;color:#8c969b}
          .v40-achievement.unlocked{background:linear-gradient(145deg,#fffdf8,#fbf6e9);border-color:#e8d8b7}.v40-achievement.unlocked .v40-achievement-mark{background:#b9474d;color:#fff;border-color:#b9474d;box-shadow:0 7px 16px rgba(185,71,77,.15)}.v40-achievement.unlocked>span{background:#f3ead5;color:#8b6828}
          
          /* ---------- SRS ---------- */
          .v40-srs-insight{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:12px 0 18px;padding:18px;border:1px solid #ddd7e7;border-radius:20px;background:linear-gradient(135deg,#f8f6fc,#fff);box-shadow:var(--v40-shadow-1)}.v40-srs-insight>div:first-child span{color:#7c6c98;font-size:9px;font-weight:850;letter-spacing:.12em}.v40-srs-insight h3{margin:5px 0 0!important;font-size:16px!important;color:var(--v40-ink)!important}.v40-srs-mini-grid{display:grid;grid-template-columns:repeat(4,minmax(78px,1fr));gap:7px}.v40-srs-mini-grid div{padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #ebe7f0;min-width:0}.v40-srs-mini-grid b{display:block;font-size:16px;color:#63577f}.v40-srs-mini-grid span{display:block;margin-top:2px;font-size:8px;color:#7e8790;white-space:nowrap}
          .srs-v32-card,.srs-study-card{box-shadow:var(--v40-shadow-2)!important;border:1px solid var(--v40-line)!important;background:#fff!important}.srs-v32-wordbox,.srs-learn-box{background:linear-gradient(145deg,#fbfcfd,#f3f7f8)!important;border-color:#dde5e7!important}.srs-v32-reveal,#revealSrs{min-height:48px!important}.srs-rating button{min-height:58px!important}
          
          /* ---------- Listening ---------- */
          #view-listening{--listen-bg:#102942;--listen-bg2:#183a54}
          #view-listening .enhanced-stage,#view-listening .listen-stage{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--listen-bg),var(--listen-bg2))!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:24px!important;box-shadow:0 20px 46px rgba(16,41,66,.18)!important}
          #view-listening .enhanced-stage:after,#view-listening .listen-stage:after{content:"";position:absolute;right:-80px;bottom:-85px;width:260px;height:160px;opacity:.18;background:repeating-radial-gradient(ellipse at bottom,#b9d8df 0 2px,transparent 3px 15px);pointer-events:none}
          .v40-player-badge{position:relative;z-index:2;display:inline-flex;align-items:center;gap:7px;margin-bottom:9px;padding:6px 9px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.06);color:#d8e6ee;font-size:9px;font-weight:700;letter-spacing:.02em}.v40-player-badge .dot{width:7px;height:7px;border-radius:50%;background:#7bd1a6;box-shadow:0 0 0 4px rgba(123,209,166,.11)}
          #view-listening .wave{position:relative;z-index:1;border-radius:16px;padding:4px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
          #view-listening .wave i{background:linear-gradient(180deg,#e2eff5,#86b6ca)!important;box-shadow:0 0 10px rgba(134,182,202,.08)}
          #view-listening .listen-speeds{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important;overflow:visible!important}
          #view-listening .listen-speeds .btn{min-width:0!important;width:100%!important;min-height:44px!important;border-radius:12px!important}
          .v40-speed-cap{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:8px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.08);color:#c6d5df;font-size:9px}.v40-speed-cap b{font-size:10px;color:#fff}
          #view-listening .enhanced-transcript-card,#view-listening .transcript-card{border-radius:22px!important;background:#fff!important;border-color:var(--v40-line)!important;box-shadow:var(--v40-shadow-2)!important}
          #view-listening .transcript-line{border-radius:13px!important;border-color:#eceeea!important;background:#fdfdfb!important}.transcript-line.active{background:#f2f7ff!important;border-color:#c8daeb!important;box-shadow:0 8px 20px rgba(85,122,159,.07)!important}.ttok.current{background:#ffe6a7!important;color:#182e40!important;box-shadow:inset 0 -2px 0 #d8a72a!important}.ttok.done{color:#526b7b!important}
          
          /* ---------- Kanji ---------- */
          .v40-kanji-hero{position:relative;overflow:hidden!important;background:linear-gradient(135deg,#10283f,#1d455e)!important;color:#fff!important;border:0!important;box-shadow:var(--v40-shadow-3)!important}.v40-kanji-hero:after{content:"木";position:absolute;right:24px;top:-20px;font-size:150px;line-height:1;color:rgba(255,255,255,.045);font-family:serif;pointer-events:none}.v40-tree-grid{position:relative}.v40-tree-grid:before{content:"";position:absolute;left:50%;top:-10px;width:1px;height:10px;background:#d6d8d2}.klc-component-card,.klc-build-grid>*{border-radius:16px!important;box-shadow:0 6px 16px rgba(20,38,56,.04)!important}.klc-hero-char{background:linear-gradient(145deg,#fff,#f4f0e9)!important;box-shadow:inset 0 0 0 1px #e1ddd5,var(--v40-shadow-1)!important}.klc-mnemonic-card{border-radius:18px!important;background:linear-gradient(145deg,#fbf5e7,#fffaf0)!important}
          
          /* ---------- Mock analytics ---------- */
          .v40-mock-analytics{display:grid;grid-template-columns:.9fr 1.2fr 1fr;gap:10px;margin:12px 0 18px}.v40-mock-analytics>article{border:1px solid var(--v40-line);border-radius:20px;background:#fff;padding:16px;box-shadow:var(--v40-shadow-1);min-width:0}.v40-mock-score{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px}.v40-mock-score .v40-ring{width:122px;height:122px}.v40-mock-score>div:last-child span{display:block;color:#8a7772;font-size:8px;font-weight:850;letter-spacing:.12em}.v40-mock-score>div:last-child b{display:block;margin-top:5px;font-size:22px;color:var(--v40-ink)}.v40-mock-score small{display:block;margin-top:4px;color:var(--v40-muted);font-size:9px}
          .v40-break-row{margin-top:9px}.v40-break-row>div:first-child{display:flex;justify-content:space-between;gap:10px}.v40-break-row span,.v40-break-row b{font-size:9px}.v40-break-row span{color:var(--v40-muted)}.v40-break-row b{color:var(--v40-ink)}.v40-break-row>div:last-child{height:5px;background:#edf0ed;border-radius:99px;margin-top:4px;overflow:hidden}.v40-break-row i{display:block;height:100%;background:linear-gradient(90deg,var(--v40-blue),#7ca4ba);border-radius:99px}.v40-history-trend{display:flex;justify-content:space-between;align-items:center;gap:22px;padding:16px 18px;margin-bottom:14px;background:#fff;border:1px solid var(--v40-line);border-radius:20px;box-shadow:var(--v40-shadow-1)}.v40-history-trend>div:first-child span{font-size:9px;color:#8a7772;font-weight:850;letter-spacing:.12em}.v40-history-trend h3{margin:4px 0 0!important;font-size:15px!important}.v40-history-trend .v40-spark{max-width:420px;margin:0}
          
          /* ---------- Existing pages unified ---------- */
          .view:not(#view-overview)>.section-head:first-child{background:rgba(255,253,250,.96)!important;border:1px solid var(--v40-line)!important;border-radius:20px!important;box-shadow:var(--v40-shadow-1)!important;padding:18px 20px!important;margin-top:0!important}
          .view:not(#view-overview)>.section-head:first-child h2{letter-spacing:-.025em!important;color:var(--v40-ink)!important}
          .card,.vocab-card,.spell-study-card,.q-card,.bubble,.reading-card,.reading-page,.grammar-card,.klc-search-panel,.klc-detail{border-color:var(--v40-line)!important;box-shadow:var(--v40-shadow-1)!important;background:#fff!important}
          .vocab-card{border-radius:18px!important;padding:15px!important}.vocab-card:hover{box-shadow:var(--v40-shadow-2)!important;border-color:#dad6ce!important}.jp-word{color:var(--v40-ink)!important}.meaning{color:#293f50!important}.translation,.pron,.english,.meta{color:#73818c!important}
          .actions .icon{min-width:44px!important;min-height:44px!important;border-radius:12px!important}.option{min-height:48px!important;border-radius:13px!important}.option.selected{box-shadow:0 0 0 2px rgba(85,122,159,.12)!important}.reading-jp{max-width:72ch!important;margin-inline:auto!important;line-height:2.05!important}
          .search-input,.select,textarea,input[type="text"]{border-radius:13px!important;border-color:#dfe1dc!important;background:#fff!important}.search-input:focus,.select:focus,textarea:focus,input[type="text"]:focus{outline:3px solid rgba(85,122,159,.12)!important;border-color:#8aa6ba!important}
          .btn{border-radius:12px!important}.btn.red,.btn.danger{background:var(--v40-red)!important;color:#fff!important}.btn.primary{background:var(--v40-navy)!important;color:#fff!important}.btn.gold{background:var(--v40-gold)!important;color:#fff!important}.btn.soft{background:#f5f6f3!important;color:#334a5a!important;border-color:#e1e3dd!important}
          .empty,.compact-empty{border-radius:18px!important;background:linear-gradient(145deg,#fbfaf7,#fff)!important;border:1px dashed #ddd9d1!important;color:#7d898f!important}
          
          /* ---------- Mobile dock ---------- */
          .mobile-dock{background:rgba(16,40,63,.96)!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 18px 38px rgba(16,40,63,.24)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
