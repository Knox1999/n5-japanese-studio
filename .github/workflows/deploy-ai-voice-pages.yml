                    <article class="v36-stat-card red"><span class="v36-stat-icon">✓</span><div><small>Vocabulary Mastered</small><strong>${done} / ${rows.length}</strong></div></article>
                    <article class="v36-stat-card purple"><span class="v36-stat-icon">${icon("srs")}</span><div><small>Review Due</small><strong>${Number(srs.due || 0)}</strong><em>${Number(srs.new || 0)} new cards</em></div></article>
                    <article class="v36-stat-card gold"><span class="v36-stat-icon">◆</span><div><small>Current Lesson</small><strong>L${String(state.lesson).padStart(2,"0")}</strong></div></article>
                    <article class="v36-stat-card green"><span class="v36-stat-icon">${icon("quiz")}</span><div><small>Mock Test Avg.</small><strong>${avg}%</strong></div></article>
                  </section>
          
                  <div class="v36-section-title"><div><span>CONTINUE LEARNING</span><h2>Pick up where you left off</h2><p>এক নজরে আজকের সবচেয়ে দরকারি practice.</p></div></div>
                  <section class="v36-continue-grid">
                    <article class="v36-continue-card lesson"><span class="v36-card-tag">LESSON ${String(state.lesson).padStart(2,"0")}</span><h3>${safeEsc(title)}</h3><p>${done}/${rows.length} words mastered</p>${cardVisual("lesson")}<div class="v36-card-bottom"><button id="v36LessonCard">Continue <span>▶</span></button><div class="v36-line"><i style="width:${pct}%"></i></div></div></article>
                    <article class="v36-continue-card srs"><span class="v36-card-tag">SRS · RECALL</span><h3>Review Session</h3><p>${Number(srs.due || 0)} due · ${Number(srs.new || 0)} new</p>${cardVisual("srs")}<button id="v36SrsCard">Start Review</button></article>
                    <article class="v36-continue-card listen"><span class="v36-card-tag">LISTENING</span><h3>Natural Japanese</h3><p>Expressive audio + live transcript</p>${cardVisual("listen")}<button id="v36ListenCard">Study Now</button></article>
                    <article class="v36-continue-card kanji"><span class="v36-card-tag">KANJI TREE</span><h3>KLC Visual Memory</h3><p>Build recognition through components</p>${cardVisual("kanji")}<button id="v36KanjiCard">Explore</button></article>
                  </section>
          
