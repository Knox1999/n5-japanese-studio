ze:15px">${highlight(text)}</div></div><button class="btn soft" id="tt">👁 Transcript</button><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>Dictation</h3><textarea id="longDictation" rows="8" lang="ja" data-jp-input="1" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:11px" placeholder="শুনে Japanese লিখুন…"></textarea></div></div><div class="section-head"><div><h3>Quick Streams</h3></div><div class="toolbar"><button class="btn primary" id="vstream">▶ Words</button><button class="btn red" id="sstream">▶ 20 Sentences</button></div></div>`;

