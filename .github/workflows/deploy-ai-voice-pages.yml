                } else renderSRS();
              });
            };
          
            // ---------- Listening transcript helpers ----------
            function listeningTokenize(text) {
              const s = String(text || '').trim();
              if (!s) return [];
              const punctuation = new Set(['。','、','？','！','…','—','・','「','」','『','』','（','）','(',')',' ', '　']);
              const particles = new Set(['は','が','を','に','で','と','も','へ','の','か','ね','よ','な','さ','し','て']);
              const out = [];
              let cur = '';
              for (const ch of [...s]) {
                if (punctuation.has(ch)) {
                  if (cur) { out.push(cur); cur = ''; }
                  if (ch.trim()) out.push(ch);
                  continue;
                }
                cur += ch;
                if ((cur.length >= 2 && particles.has(ch)) || cur.length >= 4) {
                  out.push(cur);
                  cur = '';
                }
              }
              if (cur) out.push(cur);
              return out;
            }
          
            function transcriptTokensHTML(text, lineId) {
              return listeningTokenize(text).map((tok, i) => `<span class="ttok" data-line="${lineId}" data-token="${i}">${esc(tok)}</span>`).join('');
            }
          
            function clearTranscriptHighlight() {
              $$('.transcript-line').forEach(el => el.classList.remove('active'));
              $$('.ttok').forEach(el => el.classList.remove('done', 'current'));
            }
          
            function markTranscript(lineId, progress = 0) {
              const line = $(`#tl-${lineId}`);
              if (!line) return;
              $$('.transcript-line').forEach(el => el.classList.toggle('active', el === line));
              line.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              const tokens = [...$$(`.ttok[data-line="${lineId}"]`)];
              if (!tokens.length) return;
              const idx = Math.max(0, Math.min(tokens.length - 1, Math.floor(progress * tokens.length)));
              tokens.forEach((el, i) => {
                el.classList.toggle('done', i < idx);
                el.classList.toggle('current', i === idx);
              });
            }
          
            function finishTranscript(lineId) {
              const tokens = [...$$(`.ttok[data-line="${lineId}"]`)];
              tokens.forEach((el) => { el.classList.remove('current'); el.classList.add('done'); });
            }
          
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          
            function expressiveRate(text, baseRate = .96, speaker = '') {
              text = String(text || '');
              let rate = Number(baseRate || .96);
              if (/？|\?$/.test(text)) rate -= 0.04;
              if (/！|!/.test(text)) rate += 0.03;
              if (/…/.test(text)) rate -= 0.03;
              if (/すみません|おねがいします|ありがとうございました|ありがとうございます/.test(text)) rate -= 0.02;
              if (speaker === 'B') rate += 0.02;
              return Math.max(0.72, Math.min(2.0, rate));
            }
          
            function transcriptPause(text, base = 520) {
              text = String(text || '');
              let extra = 0;
              if (/？|\?/.test(text)) extra += 120;
              if (/！|!/.test(text)) extra += 60;
              if (/…/.test(text)) extra += 120;
              if (/、/.test(text)) extra += 80;
              return base + extra;
            }
          
            // ---------- Listening up to 2×, expressive pacing, transcript highlighting ----------
            let listeningRunId = 0;
            renderListening = function() {
              const L = state.content, dlg = L.dialogue_extended || L.dialogue, text = L.reading_extended || L.reading;
              const readChunks = jpSentences(text).filter(Boolean);
              const vocabLines = state.vocab.filter(v => v.example?.jp).slice(0, 18).map(v => v.example.jp);
          
              const dialogueItems = dlg.map((x, i) => ({ id: `d-${i}`, speaker: x[0], text: x[1], bn: x[2], bucket: 'dialogue' }));
              const readingItems = readChunks.map((line, i) => ({ id: `r-${i}`, speaker: 'R', text: line, bn: '', bucket: 'reading' }));
              const vocabItems = vocabLines.map((line, i) => ({ id: `v-${i}`, speaker: 'S', text: line, bn: '', bucket: 'sentence' }));
          
              const coreItems = [...dialogueItems, ...readingItems];
              const shadowItems = [...dialogueItems.flatMap(x => [x, x]), ...readingItems, ...vocabItems.slice(0, 8)];
              const marathonItems = [...dialogueItems, ...readingItems, ...vocabItems, ...dialogueItems, ...readingItems];
          
              const transcriptHTML = `
                <div class="transcript-group"><div class="eyebrow">DIALOGUE</div>${dialogueItems.map(item => `
                  <div class="transcript-line" id="tl-${item.id}">
                    <div class="transcript-line-top"><b>${esc(item.speaker)}：</b><span class="live-badge">live</span></div>
                    <div class="transcript-jp">${transcriptTokensHTML(item.text, item.id)}</div>
                    <div class="transcript-bn">${esc(item.bn || '')}</div>
                  </div>`).join('')}</div>
                <div class="transcript-group"><div class="eyebrow">READING</div>${readingItems.map(item => `
                  <div class="transcript-line reading-line" id="tl-${item.id}">
                    <div class="transcript-line-top"><b>R</b><span class="live-badge">reading</span></div>
                    <div class="transcript-jp">${transcriptTokensHTML(item.text, item.id)}</div>
                  </div>`).join('')}</div>`;
          
              $('#view-listening').innerHTML = `
                <div class="section-head listening-head"><div><div class="eyebrow">LISTENING + SHADOWING</div><h2>Natural Japanese Listening Lab</h2><p>Instant pre-generated audio · softer pacing · live transcript highlight</p></div></div>
                <div class="listening-modes clean-listen-cards">
                  <button class="listening-mode-card" id="listenCore"><b>01</b><strong>Extended Listening</strong><span>≈ 4–6 min</span><small>conversation + reading</small></button>
                  <button class="listening-mode-card" id="listenShadow"><b>02</b><strong>Shadowing Marathon</strong><span>≈ 7–9 min</span><small>repeat-and-shadow flow</small></button>
                  <button class="listening-mode-card featured" id="listenMarathon"><b>03</b><strong>Intensive Marathon</strong><span>≈ 10–12 min</span><small>long practice stream</small></button>
                </div>
                <div class="listen-grid enhanced-listen-grid">
                  <div class="listen-stage enhanced-stage">
                    <div class="listen-stage-top"><div><div class="eyebrow">NOW PLAYING</div><h3>${esc(L.scenario)}</h3></div><div class="playing-pill" id="playingMode">Ready</div></div>
                    <div class="wave refined-wave" id="wave">${'<i></i>'.repeat(18)}</div>
                    <div class="toolbar listen-speeds clean-speeds">
                      <button class="btn glass" id="lb">0.75×</button>
                      <button class="btn glass" id="ln">0.90×</button>
                      <button class="btn glass" id="lf">1×</button>
                      <button class="btn glass" id="l125">1.25×</button>
                      <button class="btn glass" id="l15">1.5×</button>
                      <button class="btn glass" id="l2">2×</button>
                      <button class="btn red" id="lstop">■ Stop</button>
                    </div>
                    <div class="shadow-tip success"><b>✓ Expressive single voice</b> — প্রতিটি line আলাদা করে natural pacing-এ বাজবে।</div>
                    <div class="shadow-tip"><b>1</b> — আগে শুধু শুনুন</div>
                    <div class="shadow-tip"><b>2</b> — highlight দেখে শব্দ ধরুন</div>
                    <div class="shadow-tip"><b>3</b> — line শেষ হলে shadow করুন</div>
                  </div>
                  <div class="card transcript-card enhanced-transcript-card">
                    <div class="transcript-card-top"><div><div class="eyebrow">LIVE TRANSCRIPT</div><h3>Audio চলার সাথে সাথে line / token highlight হবে</h3></div><span class="live-indicator">● Sync on</span></div>
                    <div id="tr" class="transcript-scroll">${transcriptHTML}</div>
                    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
                    <h3>Dictation</h3>
                    <textarea id="longDictation" rows="7" lang="ja" data-jp-input="1" style="width:100%;border:1px solid var(--line);border-radius:14px;padding:12px" placeholder="শুনে Japanese লিখুন…"></textarea>
                  </div>
                </div>
                <div class="section-head"><div><h3>Quick Streams</h3><p>Vocabulary sentence stream দ্রুত অনুশীলনের জন্য।</p></div><div class="toolbar"><button class="btn primary" id="vstream">▶ Words</button><button class="btn soft" id="sstream">▶ 18 Sentences</button></div></div>`;
          
              const wave = on => $('#wave')?.classList.toggle('playing', on);
              const playingMode = $('#playingMode');
              const setMode = text => { if (playingMode) playingMode.textContent = text; };
              let currentSpeed = 1.0;
          
              const stopListening = () => {
                listeningRunId += 1;
                stopSpeech();
                wave(false);
                setMode('Stopped');
                clearTranscriptHighlight();
              };
          
              const playItems = async (items, label, rate = 1, gap = 520) => {
                const runId = ++listeningRunId;
                const startedAt = Date.now();
                stopSpeech();
                clearTranscriptHighlight();
                wave(true);
                setMode(label);
                for (const item of items) {
                  if (runId !== listeningRunId) break;
                  await window.N5_INSTANT_AUDIO.playDetailed(item.text, {
                    rate: expressiveRate(item.text, rate, item.speaker),
                    interrupt: false,
                    onstart: () => markTranscript(item.id, 0),
                    onprogress: ({ progress }) => markTranscript(item.id, progress),
                    onend: () => finishTranscript(item.id)
                  });
                  if (runId !== listeningRunId) break;
