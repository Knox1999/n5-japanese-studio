                  <section class="v36-lesson-roadmap">${lessons.map(x => `<button class="v36-lesson-card ${Number(x.lesson) === Number(state.lesson) ? "current" : ""}" data-v36-lesson="${x.lesson}"><span>L${String(x.lesson).padStart(2,"0")}</span><strong>${safeEsc(x.title)}</strong><small>${x.count} words</small><i>→</i></button>`).join("")}</section>`;
          
                q("#v36ContinueVocab")?.addEventListener("click", () => showView("vocab"));
                q("#v36StartSrs")?.addEventListener("click", () => startSrsSession(8));
                q("#v36LessonCard")?.addEventListener("click", () => showView("vocab"));
