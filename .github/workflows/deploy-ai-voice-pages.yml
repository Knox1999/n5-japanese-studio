                ${r ? `<div class="srs-rating srs-v32-rating"><button data-rate="again" class="rate-again">Again<small>10 min</small></button><button data-rate="hard" class="rate-hard">Hard<small>shorter</small></button><button data-rate="good" class="rate-good">Good<small>normal</small></button><button data-rate="easy" class="rate-easy">Easy<small>longer</small></button></div>` : ""}
              </div>`;
