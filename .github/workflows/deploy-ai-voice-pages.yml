            bindSrs = function(card) {
              activateJapaneseInputs($("#view-srs"));
              $("#endSrs").onclick = () => { state.srsSession = null; state.srsIndex = 0; renderSRS(); };
          
              const prime = () => { try { window.N5_INSTANT_AUDIO?.unlock?.(); } catch {} };
