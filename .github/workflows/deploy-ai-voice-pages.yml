              const wrappedDone = () => {
                track("shadowing_complete", {
                  lesson_number: currentLesson(),
                  shadowing_type: shadow.type,
                  line_count: lineCount,
                  playback_speed: Number(rate || 0),
                  duration_seconds: Math.max(0, Math.round((Date.now() - startedAt) / 1000)),
                });
                try { done?.(); } catch {}
              };
              return original.call(this, lines, pause, rate, wrappedDone);
            });
          
          
            window.addEventListener("n5:shadowing-complete", event => {
              const d = event?.detail || {};
              track("shadowing_complete", {
                lesson_number: currentLesson(),
                shadowing_type: d.shadowing_type || "listening_shadowing",
                line_count: Number(d.line_count || 0),
                playback_speed: Number(d.playback_speed || 0),
                duration_seconds: Number(d.duration_seconds || 0),
              });
            });
          
            function audioEventFromClick(target) {
              const el = target?.closest?.("button");
              if (!el) return null;
              const lesson = currentLesson();
          
              const card = el.closest(".vocab-card");
              if (card && (el.classList.contains("wa") || el.classList.contains("sa"))) {
                const v = currentVocabById(card.dataset.id);
                if (!v) return null;
                return {
                  audio_type: el.classList.contains("wa") ? "vocabulary_word" : "vocabulary_sentence",
                  audio_label: el.classList.contains("wa") ? v.japanese : (v.example?.jp || ""),
                  lesson_number: lesson,
                  word_id: Number(v.id || 0),
                  word_number: Number(v.word_no || 0),
                };
              }
          
              if (el.classList.contains("lp")) {
                const i = Number(el.dataset.i || 0);
                const dlg = state?.content?.dialogue_extended || state?.content?.dialogue || [];
                return {
                  audio_type: "conversation_line",
                  audio_label: dlg[i]?.[1] || `line_${i + 1}`,
                  lesson_number: lesson,
                  line_number: i + 1,
                };
              }
          
              if (el.classList.contains("mp")) {
                const v = currentVocabById(el.dataset.id);
                return {
                  audio_type: "micro_practice",
                  audio_label: v?.example?.jp || v?.japanese || "",
                  lesson_number: lesson,
                  word_id: Number(v?.id || 0),
                };
              }
          
              if (el.classList.contains("qa")) {
                return {
                  audio_type: "quiz_question",
                  audio_label: el.dataset.text || "quiz_audio",
                  lesson_number: lesson,
                };
              }
          
              const map = {
                playWords: ["vocabulary_stream", "Vocabulary Word Stream"],
                cp: ["conversation_full", "Full Conversation"],
                cs: ["conversation_slow", "Slow Full Conversation"],
                csh: ["conversation_shadowing", "Conversation Shadowing"],
                rp: ["reading_full", "Full Reading Passage"],
                rs: ["reading_slow", "Slow Reading Passage"],
                rshadow: ["reading_shadowing", "Reading Shadowing"],
                r2: ["reading_repeat", "Full Reading Repeat"],
                rewriteAudio: ["reading_rewrite_audio", "Reading Rewrite Passage"],
                listenCore: ["listening_extended", "Extended Listening"],
                listenShadow: ["listening_shadowing", "Shadowing Marathon"],
                listenMarathon: ["listening_intensive", "Intensive Marathon"],
                lb: ["listening_speed", "Core Listening 0.78x"],
                ln: ["listening_speed", "Core Listening 0.90x"],
                lf: ["listening_speed", "Core Listening 1x"],
                l3: ["listening_speed", "Core Listening 3x"],
                vstream: ["listening_word_stream", "Quick Word Stream"],
                sstream: ["listening_sentence_stream", "Quick Sentence Stream"],
                spellWordAudio: ["spelling_word", "Spelling Word Audio"],
                spellAudio: ["spelling_prompt", "Spelling Audio Prompt"],
                sla: ["srs_word", "SRS Learn Audio"],
                sra: ["srs_word", "SRS Recall Audio"],
                srsWordVoice: ["srs_word", "SRS Word Audio"],
                srsSentenceVoice: ["srs_sentence", "SRS Sentence Audio"],
                klcSpeak: ["kanji", "KLC Kanji Audio"],
                voiceTestBtn: ["voice_test", "Natural Voice Test"],
              };
          
              const hit = map[el.id];
              if (!hit) return null;
          
              const out = {
                audio_type: hit[0],
                audio_label: hit[1],
                lesson_number: lesson,
              };
          
              const speeds = { lb:.75, ln:.90, lf:1 };
              if (speeds[el.id]) out.playback_speed = speeds[el.id];
          
              if (el.id === "klcSpeak") {
                out.audio_label = state?.klcSelected?.kanji || hit[1];
                out.klc_number = Number(state?.klcSelected?.klc_no || 0);
              }
          
              if (el.id === "spellWordAudio" || el.id === "spellAudio") {
                const c = state?.spellingSession?.[state?.spellingIndex || 0];
                out.audio_label = c?.japanese || c?.spelling_text || hit[1];
                out.word_id = Number(c?.id || 0);
              }
          
              if (["sla","sra","srsWordVoice","srsSentenceVoice"].includes(el.id)) {
                const c = state?.srsSession?.[state?.srsIndex || 0];
                out.audio_label = el.id === "srsSentenceVoice" ? (c?.example?.jp || hit[1]) : (c?.japanese || hit[1]);
                out.word_id = Number(c?.id || 0);
                out.word_number = Number(c?.word_no || 0);
              }
              return out;
            }
          
            // ------------------------------------------------------------
            // Delegated listener: dynamic cards/buttons need no MutationObserver.
            // ------------------------------------------------------------
            document.addEventListener("click", event => {
              const button = event.target?.closest?.("button");
              if (!button) return;
          
              // Sources for lesson_open / section_open, no separate roadmap event.
              if (button.closest?.("[data-jump]")) {
                pendingLessonSource = "roadmap";
                pendingSectionSource = "roadmap";
              } else if (button.matches?.("[data-sl]")) {
                pendingLessonSource = "search";
                pendingSectionSource = "search";
              } else if (button.dataset?.view) {
                pendingSectionSource = "navigation";
              }
          
              // 3) vocabulary_mastered
              if (button.classList.contains("ma")) {
                const card = button.closest(".vocab-card");
                const id = Number(card?.dataset.id || 0);
                const v = currentVocabById(id);
                setTimeout(() => {
                  const mastered = !!state?.progress?.[id];
                  track("vocabulary_mastered", {
                    lesson_number: Number(v?.lesson || currentLesson()),
                    word_id: id,
                    word_number: Number(v?.word_no || 0),
                    japanese_word: v?.japanese || "",
                    mastered_state: mastered ? 1 : 0,
                    lesson_mastered_count: lessonMastered(),
                    total_mastered_count: totalMastered(),
                  });
                }, 0);
              }
          
              // 4) practice_result — SRS
              if (button.matches("[data-rate]")) {
                try {
                  const card = state?.srsSession?.[state?.srsIndex || 0];
                  const rating = button.dataset.rate || "";
                  track("practice_result", {
                    practice_type: "srs",
                    result_status: rating,
                    lesson_number: currentLesson(),
                    word_id: Number(card?.id || 0),
                    word_number: Number(card?.word_no || 0),
                    japanese_word: card?.japanese || "",
                    srs_phase: card?.srs?.phase || "learn",
                  });
                } catch {}
              }
          
              // 4) practice_result — Spelling checked.
              if (button.id === "checkSpell") {
                try {
                  const input = document.querySelector("#spellInput");
                  if (String(input?.value || "").trim()) {
                    const card = state?.spellingSession?.[state?.spellingIndex || 0];
                    const usedHint = !!state?.spellingHint;
                    const mode = state?.spellingMode || "";
                    setTimeout(() => {
                      const r = state?.spellingResult;
                      if (!r) return;
                      track("practice_result", {
                        practice_type: "spelling",
                        result_status: r.is_correct ? "correct" : "wrong",
                        lesson_number: currentLesson(),
                        word_id: Number(card?.id || 0),
                        word_number: Number(card?.word_no || 0),
                        japanese_word: card?.japanese || "",
                        spelling_mode: mode,
                        used_hint: usedHint ? 1 : 0,
                      });
                    }, 40);
                  }
                } catch {}
              }
          
              // 4) practice_result — Spelling skipped (skip is neutral, not wrong).
              if (button.id === "skipSpell") {
                try {
                  const card = state?.spellingSession?.[state?.spellingIndex || 0];
                  track("practice_result", {
                    practice_type: "spelling",
                    result_status: "skip",
                    lesson_number: currentLesson(),
                    word_id: Number(card?.id || 0),
                    word_number: Number(card?.word_no || 0),
                    japanese_word: card?.japanese || "",
                    spelling_mode: state?.spellingMode || "",
                  });
                } catch {}
              }
          
              // Arm the only three explicit Shadowing flows.
              const shadowMap = {
                csh: "conversation_shadowing",
                rshadow: "reading_shadowing",
                listenShadow: "listening_shadowing",
              };
              if (shadowMap[button.id]) {
                pendingShadow = {
                  type: shadowMap[button.id],
                  armedAt: Date.now(),
                };
              }
          
              // 5) audio_play
              const audioParams = audioEventFromClick(event.target);
              if (audioParams) track("audio_play", audioParams);
            }, true);
          
            document.addEventListener("change", event => {
              if (event.target?.id === "lessonSelect") {
                pendingLessonSource = "lesson_selector";
                pendingSectionSource = "lesson_selector";
              }
            }, true);
          
            // ------------------------------------------------------------
            // 8) app_error
            // JavaScript, Promise, resource and audio failures all use one event.
            // ------------------------------------------------------------
            window.addEventListener("error", event => {
              const t = event.target;
              if (t && t !== window && (t.src || t.href)) {
                trackErrorOnce({
                  error_type: "resource",
                  error_message: `${t.tagName || "resource"} failed to load`,
                  resource_type: t.tagName || "RESOURCE",
                  resource_path: safePath(t.src || t.href),
                });
                return;
              }
          
              trackErrorOnce({
                error_type: "javascript",
                error_message: clip(event.message || "JavaScript error", 120),
                source_path: safePath(event.filename || ""),
                line_number: Number(event.lineno || 0),
              });
            }, true);
          
            window.addEventListener("unhandledrejection", event => {
              trackErrorOnce({
                error_type: "promise",
                error_message: clip(event.reason?.message || event.reason || "Unhandled promise rejection", 120),
              });
            });
          
            window.addEventListener("n5:audio-error", event => {
              trackErrorOnce({
                error_type: "audio",
                error_message: clip(event.detail?.message || "Audio playback error", 120),
                audio_label: clip(event.detail?.text || "", 80),
              });
            });
          
            // Initial page state.
            setTimeout(() => {
              const lesson = currentLesson();
              const view = currentView();
              track("lesson_open", {
                lesson_number: lesson,
                lesson_label: lesson ? `L${String(lesson).padStart(2, "0")}` : "",
                target_view: view,
                open_source: "initial_load",
              });
              if (!lastTrackedSection) {
                track("section_open", {
                  lesson_number: lesson,
                  section_name: view,
                  previous_section: "",
                  open_source: "initial_load",
                });
                lastTrackedSection = view;
              }
            }, 400);
          
            window.N5_ANALYTICS = {
              track,
              measurementId: MEASUREMENT_ID,
              customEvents: [...CUSTOM_EVENTS],
            };
          
            console.info("N5 Lean Learning Analytics v32 enabled: exactly 8 custom events.");
          })();
          JAVASCRIPT

      - name: Build Japanese Calm Premium UI v34
        shell: bash
        run: |
          cat > _build/calm-premium-ui-v34.js <<'JAVASCRIPT'
          (() => {
            "use strict";
            document.documentElement.dataset.ui = "calm-premium-v34";
          
            const style = document.createElement("style");
            style.id = "n5-calm-premium-ui-v34";
            style.textContent = `
              /* ================================================================
                 N5 Studio v34 — Japanese Calm Premium
                 Research-led goals: long-study comfort, clear hierarchy,
                 accessible contrast, generous whitespace, reliable touch targets.
                 ================================================================ */
              :root{
                --navy:#13293D;
                --navy-2:#1B3B55;
                --ink:#172633;
                --muted:#5F6B76;
                --paper:#F7F4ED;
                --surface:#FFFDFC;
                --surface-2:#F2F4F2;
                --line:#E2E4DF;
                --line-strong:#D4D9D5;
                --red:#B94347;
                --red-soft:#FBEEEE;
                --sage:#47715E;
                --sage-soft:#EDF5F0;
                --indigo:#586E91;
                --indigo-soft:#EEF1F7;
                --gold:#8C671F;
                --gold-soft:#F8F0DF;
                --info:#426987;
                --info-soft:#EEF5F8;
                --radius-xs:10px;
                --radius-sm:14px;
                --radius-md:18px;
                --radius-lg:24px;
                --shadow-1:0 1px 2px rgba(19,41,61,.035),0 5px 16px rgba(19,41,61,.035);
                --shadow-2:0 10px 28px rgba(19,41,61,.065);
                --shadow-3:0 18px 48px rgba(19,41,61,.095);
                --focus:0 0 0 3px rgba(88,110,145,.20);
                --content-max:1280px;
              }
          
              *,*::before,*::after{box-sizing:border-box}
              html{
                background:var(--paper);
                scroll-padding-top:82px;
                color-scheme:light;
                -webkit-text-size-adjust:100%;
              }
              body{
                color:var(--ink)!important;
                background:
                  radial-gradient(circle at 92% -5%,rgba(140,103,31,.055),transparent 31rem),
                  radial-gradient(circle at 0 40%,rgba(88,110,145,.045),transparent 32rem),
                  linear-gradient(180deg,#F8F6F0 0%,#F5F6F3 48%,#F7F4ED 100%)!important;
                -webkit-font-smoothing:antialiased;
                text-rendering:optimizeLegibility;
                line-height:1.55;
              }
              img,svg,video,canvas{max-width:100%}
              button,input,select,textarea{font:inherit}
              button,.btn,.icon,.option,.lesson-tile,.klc-chip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
              button:focus-visible,.btn:focus-visible,.icon:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.option:focus-visible,.lesson-tile:focus-visible{
                outline:2px solid transparent!important;
                box-shadow:var(--focus)!important;
              }
          
              /* Section identity: subtle context change without visual noise. */
              #view-overview{--section-accent:var(--navy);--section-soft:#EEF2F4}
              #view-vocab{--section-accent:var(--red);--section-soft:var(--red-soft)}
              #view-spelling{--section-accent:var(--gold);--section-soft:var(--gold-soft)}
              #view-srs{--section-accent:var(--indigo);--section-soft:var(--indigo-soft)}
              #view-conversation{--section-accent:var(--sage);--section-soft:var(--sage-soft)}
              #view-reading{--section-accent:var(--info);--section-soft:var(--info-soft)}
              #view-listening{--section-accent:var(--navy);--section-soft:#EDF2F6}
              #view-grammar{--section-accent:var(--indigo);--section-soft:var(--indigo-soft)}
              #view-kanji{--section-accent:var(--red);--section-soft:var(--red-soft)}
              #view-mock{--section-accent:var(--red);--section-soft:var(--red-soft)}
              #view-history{--section-accent:var(--sage);--section-soft:var(--sage-soft)}
              .view.active .eyebrow{color:var(--section-accent,var(--red))!important}
          
              /* ---------- Shell ---------- */
              .topbar{
                min-height:68px!important;
                padding:9px clamp(14px,2.2vw,30px)!important;
                background:rgba(19,41,61,.975)!important;
                border-bottom:1px solid rgba(255,255,255,.07)!important;
                box-shadow:0 8px 24px rgba(19,41,61,.16)!important;
                backdrop-filter:blur(14px) saturate(125%);
              }
              .brand{gap:11px!important}
              .seal{
                width:42px!important;height:42px!important;border-radius:13px!important;
                background:linear-gradient(145deg,#C45151,#A83A3E)!important;
                box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 5px 14px rgba(0,0,0,.12)!important;
              }
              .brand-copy strong{font-size:16px!important;letter-spacing:-.015em!important}
              .brand-copy span{font-size:10px!important;color:#BAC8D2!important}
              .top-actions{gap:7px!important}
              .top-actions .btn{min-height:42px!important;border-radius:12px!important;padding:8px 12px!important}
              .top-actions .btn.glass{background:rgba(255,255,255,.07)!important;border-color:rgba(255,255,255,.12)!important}
              .top-actions .btn.gold{background:#D9B760!important;color:#253042!important;border-color:#E1C77D!important}
          
              .layout{max-width:1640px!important;grid-template-columns:244px minmax(0,1fr)!important;min-height:calc(100vh - 68px)!important}
              .sidebar{
                top:68px!important;height:calc(100vh - 68px)!important;
                padding:15px 12px 28px!important;
                background:rgba(250,250,247,.94)!important;
                border-right:1px solid var(--line)!important;
                backdrop-filter:blur(14px) saturate(120%);
              }
              .side-section{padding:10px 7px 14px!important;margin-bottom:6px!important;border-bottom-color:#E7E9E5!important}
              .side-section .eyebrow{font-size:9px!important;letter-spacing:.16em!important;margin-bottom:8px!important}
              .nav{gap:4px!important;margin-top:8px!important}
              .nav button{
                min-height:42px!important;padding:9px 10px!important;border-radius:11px!important;
                color:#465766!important;font-size:12px!important;font-weight:650!important;
                transition:background .15s ease,color .15s ease,box-shadow .15s ease;
              }
              .nav button:hover{background:#EFF1EE!important;color:var(--navy)!important}
              .nav button.active{
                background:var(--navy)!important;color:#fff!important;
                box-shadow:0 5px 14px rgba(19,41,61,.13)!important;
              }
              .nav .mock-link:not(.active){background:#FFF6F5!important;border-color:#EED6D4!important;color:#9E3A3D!important}
          
              .main{
                width:100%!important;min-width:0!important;
                max-width:var(--content-max)!important;
                margin-inline:auto!important;
                padding:26px clamp(20px,2.6vw,38px) 64px!important;
              }
              .view.active{animation:v34Enter .18s ease both}
              @keyframes v34Enter{from{opacity:.45;transform:translateY(3px)}to{opacity:1;transform:none}}
          
              /* ---------- Typography / hierarchy ---------- */
              .eyebrow{font-size:10px!important;letter-spacing:.16em!important;font-weight:800!important;line-height:1.35!important}
              h1,h2,h3{color:var(--ink)!important;letter-spacing:-.025em!important;text-wrap:balance}
              .section-head{margin:28px 0 13px!important;gap:14px!important}
              .section-head h2{font-size:clamp(22px,2.2vw,28px)!important;line-height:1.18!important}
              .section-head h3{font-size:18px!important;line-height:1.25!important}
              .section-head p,.meta{color:var(--muted)!important}
              .section-head p{font-size:13px!important;line-height:1.65!important;max-width:72ch!important}
              .jp,.jp-word,.example,.reading-jp,.transcript-jp,.srs-v32-word,.srs-v32-sentence{font-feature-settings:"palt" 1}
              .jp-word{line-height:1.45!important}
              .example,.reading-jp,.bubble .jp{line-height:1.8!important}
          
              /* ---------- Inputs ---------- */
              .select,.search-input,input[type="text"],input[type="search"],textarea{
                min-height:44px!important;
                border:1px solid #D7DDD9!important;
                background:rgba(255,255,255,.92)!important;
                color:var(--ink)!important;
                border-radius:12px!important;
                box-shadow:none!important;
                transition:border-color .14s ease,box-shadow .14s ease,background .14s ease;
              }
              textarea{min-height:110px!important}
              .select:focus,.search-input:focus,input:focus,textarea:focus{border-color:#899BB1!important;background:#fff!important;box-shadow:var(--focus)!important}
              ::placeholder{color:#87929B!important;opacity:1}
          
              /* ---------- Hero & overview ---------- */
              .hero{
                padding:30px 32px!important;border-radius:var(--radius-lg)!important;
                background:
                  radial-gradient(circle at 88% 0,rgba(185,139,47,.22),transparent 14rem),
                  linear-gradient(135deg,#13293D 0%,#1B3B55 68%,#214B67 100%)!important;
                border:1px solid rgba(255,255,255,.08)!important;
                box-shadow:var(--shadow-3)!important;
              }
              .hero h1{font-size:clamp(28px,3vw,38px)!important;line-height:1.14!important;color:#fff!important;margin-bottom:10px!important}
              .hero p{font-size:14px!important;line-height:1.7!important;color:#D6E0E7!important;max-width:76ch!important}
              .pills{gap:7px!important;margin-top:16px!important}
              .pill{padding:6px 10px!important;border-radius:999px!important;background:rgba(255,255,255,.075)!important;border-color:rgba(255,255,255,.11)!important;color:#F4F6F7!important;font-size:10px!important}
              .stats{gap:10px!important;margin-top:12px!important}
              .stat{
                padding:16px!important;border-radius:16px!important;
                background:rgba(255,253,252,.97)!important;border:1px solid var(--line)!important;
                box-shadow:var(--shadow-1)!important;
              }
              .stat strong{font-size:24px!important;color:var(--navy-2)!important;letter-spacing:-.03em!important}
              .stat span{font-size:10px!important;color:var(--muted)!important}
              .progress{height:6px!important;background:#E9ECE8!important;border-radius:999px!important}
              .progress>i{background:linear-gradient(90deg,var(--red),#D38462)!important;border-radius:999px!important}
          
              /* ---------- Surfaces ---------- */
              .card,.vocab-card,.dialogue,.reading-box,.grammar-card,.kanji-card,.micro-card,.kanji-vocab,
              .mock-option,.q-card,.exam-side,.exam-title,.score-box,.klc-search-panel,.klc-chip,
              .klc-detail-head,.klc-one-level,.klc-component-card,.klc-recursive-panel,.klc-legend>div,
              .srs-study-card,.srs-v32-card,.spell-study-card,.spell-hero,.mock-hero{
                background:rgba(255,253,252,.97)!important;
                border-color:var(--line)!important;
                box-shadow:var(--shadow-1)!important;
              }
              .card,.dialogue,.reading-box,.grammar-card,.kanji-card,.mock-option,.q-card,.exam-side,.exam-title,.mock-hero{border-radius:var(--radius-md)!important}
              .card:hover,.grammar-card:hover,.kanji-card:hover,.mock-option:hover{border-color:var(--line-strong)!important;box-shadow:var(--shadow-2)!important}
          
              /* ---------- Buttons / controls ---------- */
              .btn{
                min-height:42px!important;padding:9px 14px!important;border-radius:11px!important;
                font-size:12px!important;font-weight:750!important;box-shadow:none!important;
                transition:background .14s ease,border-color .14s ease,transform .14s ease,box-shadow .14s ease;
              }
              .btn:hover{transform:translateY(-1px)}
              .btn.primary{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important;box-shadow:0 5px 14px rgba(19,41,61,.12)!important}
              .btn.red{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important;box-shadow:0 5px 14px rgba(185,67,71,.12)!important}
              .btn.soft{background:#F3F5F3!important;color:var(--navy)!important;border-color:#DDE2DF!important}
              .btn.danger{background:#FFF3F2!important;color:#9D383C!important;border-color:#EAD4D2!important}
              .icon{width:40px!important;height:40px!important;min-width:40px!important;border-radius:11px!important;background:#F5F6F4!important;border-color:#DDE2DF!important}
          
              /* ---------- Lesson roadmap ---------- */
              .lesson-grid{gap:9px!important}
              .lesson-tile{
                min-height:76px!important;padding:11px 12px!important;border-radius:14px!important;
                background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:var(--shadow-1)!important;
              }
