          grep -q 'srsWordVoice' _site/analytics-events-v32.js
          grep -q 'crypto.getRandomValues' _site/app-clean-v32.js
          grep -q 'pointerdown' _site/instant-audio-v32.js
          if grep -q 'new MutationObserver' _site/app-clean-v32.js; then
            echo "ERROR: v30 clean app must not create MutationObserver patches"
            exit 1
          fi
          grep -q -- '--paper:#F7F4ED' _site/calm-premium-ui-v34.js
          grep -q -- '--red:#B94347' _site/calm-premium-ui-v34.js
          grep -q 'min-height:48px' _site/calm-premium-ui-v34.js
          grep -q 'prefers-reduced-motion' _site/calm-premium-ui-v34.js
          grep -q 'section-accent' _site/calm-premium-ui-v34.js
          grep -q 'max-width:72ch' _site/calm-premium-ui-v34.js
          node --check _site/instant-audio-v32.js
          node --check _site/app-clean-v32.js
          node --check _site/analytics-events-v32.js
          node --check _site/calm-premium-ui-v34.js
          node --check _site/production-premium-ui-v36.js
          echo "v36 production premium UI QA PASS"
          echo "MP3 clips: $(find _site/audio -name '*.mp3' | wc -l)"
          echo "Published site size:"
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
