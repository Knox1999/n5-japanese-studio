name: Deploy N5 Studio — True Single-Voice Shadowing Fix v24

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore generated-audio cache
        uses: actions/cache@v4
        with:
          path: _audio_cache
          key: n5-kokoro-jf-alpha-v22-${{ hashFiles('index.html') }}
          restore-keys: |
            n5-kokoro-jf-alpha-v22-

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-japanese-v1
          restore-keys: |
            kokoro-82m-japanese-

      - name: Install build-time Japanese neural TTS
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install \
            "kokoro>=0.9.4,<1.0" \
            "misaki[ja]>=0.9.4,<1.0" \
            "soundfile>=0.12" \
            "numpy>=1.26,<3"

          # Misaki Japanese second-gen G2P expects the full UniDic dictionary.
          # This happens only on the GitHub Actions builder, never on the phone.
          python -m unidic download

      - name: Extract every fixed study text that needs audio
        shell: bash
        run: |
          mkdir -p _build _site _audio_cache

          cat > _build/extract_audio_texts.py <<'PYTHON'
          import hashlib, json, re, unicodedata
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          m = re.search(
              r'window\.N5_OFFLINE_DATA\s*=\s*(\{.*?\});\s*</script>',
              html,
              re.S,
          )
          if not m:
              raise SystemExit("Could not find embedded N5_OFFLINE_DATA in index.html")

          data = json.loads(m.group(1))
          items = {}

          def norm(text):
              text = unicodedata.normalize("NFC", str(text or ""))
              return re.sub(r"\s+", " ", text).strip()

          def add(text, lesson=0, kind="misc"):
              text = norm(text)
              if not text:
                  return
              key = hashlib.sha1(text.encode("utf-8")).hexdigest()
              row = items.setdefault(key, {
                  "hash": key,
                  "text": text,
                  "lessons": [],
                  "kinds": [],
              })
              if lesson and int(lesson) not in row["lessons"]:
                  row["lessons"].append(int(lesson))
              if kind not in row["kinds"]:
                  row["kinds"].append(kind)

          # Vocabulary + 1,011 curated natural sentences.
          for v in data.get("vocabulary", []):
              lesson = int(v.get("lesson") or 0)
              add(v.get("tts_text") or v.get("japanese"), lesson, "vocab")
              add(v.get("spelling_text"), lesson, "spelling")
              ex = v.get("example") or {}
              if isinstance(ex, dict):
                  add(ex.get("jp") or ex.get("japanese"), lesson, "sentence")

          # Lesson-fixed conversation / reading / shadowing / grammar.
          lessons = (data.get("content") or {}).get("lessons") or {}
          for lesson_key, L in lessons.items():
              lesson = int(lesson_key)

              for name in ("dialogue", "dialogue_extended"):
                  for turn in L.get(name) or []:
                      if isinstance(turn, list) and len(turn) > 1:
                          add(turn[1], lesson, "conversation")

              for name in ("reading", "reading_extended"):
                  add(L.get(name), lesson, "reading_full")

              for chunk in L.get("shadowing_chunks") or []:
                  add(chunk, lesson, "shadow")

              for pair in L.get("reading_extra_pairs") or []:
                  if isinstance(pair, list) and pair:
                      add(pair[0], lesson, "reading_sentence")

              for grammar in L.get("grammar") or []:
                  if isinstance(grammar, list) and len(grammar) > 2:
                      add(grammar[2], lesson, "grammar")

          # Voice test.
          add(
              "こんにちは。きょうも いっしょに にほんごを れんしゅうしましょう。",
              0,
              "voice_test",
          )

          # Sentence-level splits of full readings so sentence shadowing never
          # has to generate at runtime.
          sentence_split = re.compile(r"(?<=[。！？])")
          for row in list(items.values()):
              if "reading_full" in row["kinds"]:
                  for sentence in sentence_split.split(row["text"]):
                      sentence = norm(sentence)
                      if sentence:
                          for lesson in row["lessons"] or [0]:
                              add(sentence, lesson, "reading_sentence")

          rows = sorted(items.values(), key=lambda x: x["hash"])
          Path("_build/audio_texts.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          per_lesson = {str(i): [] for i in range(1, 26)}
          for row in rows:
              for lesson in row["lessons"]:
                  if str(lesson) in per_lesson:
                      per_lesson[str(lesson)].append(row["hash"])

          Path("_build/lesson_audio.json").write_text(
              json.dumps(per_lesson, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(f"Unique fixed Japanese audio clips: {len(rows)}")
          for i in range(1, 26):
              print(f"L{i:02d}: {len(per_lesson[str(i)])} clips")
          PYTHON

          python _build/extract_audio_texts.py

      - name: Pre-generate natural Japanese MP3 with Kokoro
        shell: bash
        run: |
          cat > _build/generate_audio.py <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          import torch
          from kokoro import KPipeline

          VOICE = "jf_alpha"
          SPEED = 0.94
          SAMPLE_RATE = 24000

          rows = json.loads(Path("_build/audio_texts.json").read_text(encoding="utf-8"))
          out_dir = Path("_audio_cache")
          out_dir.mkdir(parents=True, exist_ok=True)

          # Let PyTorch use the runner CPUs efficiently.
          cpu_count = max(1, os.cpu_count() or 2)
          torch.set_num_threads(cpu_count)
          print("CPU threads:", cpu_count, flush=True)

          print("Loading Kokoro Japanese pipeline once...", flush=True)
          pipeline = KPipeline(lang_code="j")
          print("Kokoro ready.", flush=True)

          generated = 0
          reused = 0
          failed = []

          for idx, row in enumerate(rows, 1):
              key = row["hash"]
              text = row["text"]
              final_mp3 = out_dir / f"{key}.mp3"

              if final_mp3.exists() and final_mp3.stat().st_size > 1000:
                  reused += 1
                  continue

              try:
                  parts = []
                  for _, _, audio in pipeline(
                      text,
                      voice=VOICE,
                      speed=SPEED,
                  ):
                      if hasattr(audio, "detach"):
                          audio = audio.detach().cpu().numpy()
                      audio = np.asarray(audio, dtype=np.float32).reshape(-1)
                      if audio.size:
                          parts.append(audio)

                  if not parts:
                      raise RuntimeError("Kokoro returned no audio")

                  # Kokoro may chunk long readings. Add a small natural pause
                  # between model chunks, not between normal shadowing lines.
                  if len(parts) == 1:
                      merged = parts[0]
                  else:
                      pause = np.zeros(int(SAMPLE_RATE * 0.12), dtype=np.float32)
                      joined = []
                      for j, part in enumerate(parts):
                          if j:
                              joined.append(pause)
                          joined.append(part)
                      merged = np.concatenate(joined)

                  with tempfile.TemporaryDirectory() as td:
                      wav = Path(td) / "clip.wav"
                      mp3 = Path(td) / "clip.mp3"
                      sf.write(wav, merged, SAMPLE_RATE, subtype="PCM_16")
                      subprocess.run([
                          "ffmpeg", "-loglevel", "error", "-y",
                          "-i", str(wav),
                          "-ac", "1",
                          "-ar", "24000",
                          "-codec:a", "libmp3lame",
                          "-b:a", "64k",
                          str(mp3),
                      ], check=True)
                      mp3.replace(final_mp3)

                  generated += 1

              except Exception as exc:
                  failed.append((key, text, repr(exc)))
                  print(f"\nFAILED {key}: {text}\n{exc}", flush=True)

              if idx % 25 == 0 or idx == len(rows):
                  print(
                      f"[{idx}/{len(rows)}] generated={generated} reused={reused} failed={len(failed)}",
                      flush=True,
                  )

          if failed:
              Path("_build/audio_failures.json").write_text(
                  json.dumps(failed, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              # A tiny number of unusual strings should not destroy the whole
              # site; runtime will clearly report missing audio for those.
              if len(failed) > 20:
                  raise SystemExit(f"Too many TTS failures: {len(failed)}")

          print("DONE", {"generated": generated, "reused": reused, "failed": len(failed)})
          PYTHON

          python _build/generate_audio.py

      - name: Build instant static-audio manifest
        shell: bash
        run: |
          cat > _build/build_manifest.py <<'PYTHON'
          import json
          from pathlib import Path

          rows = json.loads(Path("_build/audio_texts.json").read_text(encoding="utf-8"))
          per_lesson = json.loads(Path("_build/lesson_audio.json").read_text(encoding="utf-8"))

          available = {
              p.stem for p in Path("_audio_cache").glob("*.mp3")
              if p.stat().st_size > 1000
          }

          manifest = {
              "version": "22",
              "voice": "jf_alpha",
              "speed": 0.94,
              "count": len(available),
              "hashes": sorted(available),
          }

          Path("_build/audio-manifest.js").write_text(
              "window.N5_STATIC_AUDIO_MANIFEST=" +
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) +
              ";\n",
              encoding="utf-8",
          )

          audio_dir = Path("_site/audio")
          audio_dir.mkdir(parents=True, exist_ok=True)

          for lesson, hashes in per_lesson.items():
              hashes = [h for h in hashes if h in available]
              (audio_dir / f"lesson-{int(lesson):02d}.json").write_text(
                  json.dumps(hashes, separators=(",", ":")),
                  encoding="utf-8",
              )

          print("Static audio manifest clips:", len(available))
          PYTHON

          python _build/build_manifest.py

      - name: Build instant browser playback engine
        shell: bash
        run: |
          cat > _build/instant-audio.js <<'JAVASCRIPT'
          (() => {
            const manifest = window.N5_STATIC_AUDIO_MANIFEST || { hashes: [] };
            const available = new Set(manifest.hashes || []);
            const base = new URL("./audio/", document.baseURI);

            let audioCtx = null;
            let source = null;
            let playToken = 0;
            const decoded = new Map();
            const MAX_MEMORY_CACHE = 48;

            const $ = (q) => document.querySelector(q);

            function normalizeText(text) {
              return String(text || "")
                .normalize("NFC")
                .replace(/\s+/g, " ")
                .trim();
            }

            async function sha1(text) {
              const bytes = new TextEncoder().encode(normalizeText(text));
              const digest = await crypto.subtle.digest("SHA-1", bytes);
              return [...new Uint8Array(digest)]
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
            }

            function getContext() {
              if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new Ctx({ latencyHint: "interactive" });
              }
              return audioCtx;
            }

            async function unlock() {
              const ctx = getContext();
              if (ctx.state !== "running") await ctx.resume();

              const b = ctx.createBuffer(1, 1, ctx.sampleRate);
              const s = ctx.createBufferSource();
              s.buffer = b;
              s.connect(ctx.destination);
              s.start();
            }

            function setStatus(text, cls = "") {
              const el = $("#instantVoiceStatus");
              if (!el) return;
              el.textContent = text;
              el.className = "voice-status " + cls;
            }

            function stop() {
              playToken += 1;
              try { window.speechSynthesis?.cancel?.(); } catch {}

              // Also cancel the original app's sequence() loop.
              // This prevents old shadowing sessions from waking up again
              // and producing 5–10 simultaneous voices.
              try {
                if (typeof state !== "undefined") {
                  state.sequenceToken = Number(state.sequenceToken || 0) + 1;
                }
              } catch {}

              if (source) {
                try { source.stop(); } catch {}
                try { source.disconnect(); } catch {}
                source = null;
              }
            }

            async function getBuffer(hash) {
              if (decoded.has(hash)) return decoded.get(hash);

              const ctx = getContext();
              const response = await fetch(new URL(`${hash}.mp3`, base), {
                cache: "force-cache",
              });
              if (!response.ok) throw new Error(`Audio HTTP ${response.status}`);

              const bytes = await response.arrayBuffer();
              const buffer = await ctx.decodeAudioData(bytes);

              // Small in-memory LRU-like cache; HTTP cache keeps the rest.
              if (decoded.size >= MAX_MEMORY_CACHE) {
                const oldest = decoded.keys().next().value;
                decoded.delete(oldest);
              }
              decoded.set(hash, buffer);
              return buffer;
            }

            async function speakInstant(text, rate = null, onend = null, interrupt = true) {
              text = normalizeText(text);
              if (!text) {
                onend?.();
                return;
              }

              if (interrupt) stop();
              const token = playToken;

              // Unlock immediately on direct tap. For sequence playback the
              // AudioContext remains unlocked after the first line.
              try { await unlock(); } catch {}

              const hash = await sha1(text);
              if (!available.has(hash)) {
                console.warn("No pre-generated audio for:", text);
                setStatus("This rare line has no pre-generated audio.", "warn");
                onend?.();
                return;
              }

              try {
                const buffer = await getBuffer(hash);
                if (token !== playToken) return;

                const ctx = getContext();
                const node = ctx.createBufferSource();
                source = node;
                node.buffer = buffer;

                // Audio itself was generated at a natural study speed.
                // Only make small runtime adjustments to preserve quality.
                const requested = Number(rate ?? $("#rate")?.value ?? 0.94);
                node.playbackRate.value = Math.max(0.50, Math.min(3.20, requested / 0.94));

                node.connect(ctx.destination);

                // v24: sequence() must not advance until this clip really ends.
                await new Promise((resolve) => {
                  let settled = false;
                  const finish = () => {
                    if (settled) return;
                    settled = true;
                    if (source === node) source = null;
                    try { node.disconnect(); } catch {}
                    try { onend?.(); } catch {}
                    resolve();
                  };
                  node.onended = finish;
                  try {
                    node.start();
                    setStatus("✓ Instant Natural Voice · true single-stream", "ready");
                  } catch (err) {
                    console.error("Audio source start failed:", err);
                    finish();
                  }
                });
              } catch (err) {
                console.error("Static audio playback error:", err);
                setStatus("Audio could not play. Reload once and tap Voice Test.", "warn");
                onend?.();
              }
            }

            async function prefetchLesson(lesson) {
              lesson = Number(lesson || 1);
              if (!lesson || lesson < 1 || lesson > 25) return;

              try {
                const listUrl = new URL(`lesson-${String(lesson).padStart(2, "0")}.json`, base);
                const res = await fetch(listUrl, { cache: "force-cache" });
                if (!res.ok) return;
                const hashes = await res.json();

                // Fetch in small batches so opening a lesson stays responsive.
                let i = 0;
                const workers = Array.from({ length: 5 }, async () => {
                  while (i < hashes.length) {
                    const hash = hashes[i++];
                    try {
                      await fetch(new URL(`${hash}.mp3`, base), { cache: "force-cache" });
                    } catch {}
                  }
                });
                await Promise.all(workers);
                setStatus(`✓ Lesson ${lesson} Natural Audio cached`, "ready");
              } catch (err) {
                console.warn("Lesson audio prefetch skipped:", err);
              }
            }

            function installUI() {
              const panel = document.querySelector(".voice-panel");
              if (!panel) return;

              panel.innerHTML = `
                <div class="eyebrow">INSTANT NATURAL JAPANESE VOICE</div>
                <div class="voice-status ready" id="instantVoiceStatus">
                  ✓ Pre-generated Kokoro · ready instantly
                </div>
                <div class="instant-voice-note">
                  No AI generation during study. Current lesson audio is prefetched automatically.
                </div>
                <div class="rate-row">
                  <span>Speed</span>
                  <input type="range" id="rate" min=".60" max="3.00" step=".05" value=".94">
                  <b id="rateValue">0.94×</b>
                </div>
                <button class="btn red" id="voiceTestBtn" style="width:100%;margin-top:8px">
                  ▶ Instant Voice Test
                </button>
              `;

              const rate = $("#rate");
              rate?.addEventListener("input", () => {
                const out = $("#rateValue");
                if (out) out.textContent = `${Number(rate.value).toFixed(2)}×`;
              });

              $("#voiceTestBtn")?.addEventListener("click", () => {
                speakInstant(
                  "こんにちは。きょうも いっしょに にほんごを れんしゅうしましょう。",
                  0.94
                );
              });
            }

            function watchLesson() {
              const select = $("#lessonSelect");
              if (!select) return;

              prefetchLesson(select.value || 1);
              select.addEventListener("change", () => prefetchLesson(select.value));

              // Also keep the next lesson warm when the current one is cached.
              const current = Number(select.value || 1);
              if (current < 25) {
                setTimeout(() => prefetchLesson(current + 1), 8000);
              }
            }

            function addStyles() {
              const style = document.createElement("style");
              style.textContent = `
                .instant-voice-note{
                  margin-top:8px;padding:8px 9px;border-radius:10px;
                  background:#eef8f4;border:1px solid #cde7dc;
                  color:#326454;font-size:9px;line-height:1.45
                }
                @media(max-width:820px){
                  .instant-voice-note{font-size:10px}
                }
              `;
              document.head.appendChild(style);
            }

            addStyles();
            installUI();

            // In the original classic-script app, global function declarations
            // are properties of window. Replacing these changes all existing
            // vocabulary/conversation/reading/listening/grammar play buttons.
            window.speak = speakInstant;
            window.stopSpeech = stop;
            window.N5_INSTANT_AUDIO = {
              speak: speakInstant,
              stop,
              prefetchLesson,
              manifest,
            };

            // Run after the existing app has created the lesson selector.
            setTimeout(watchLesson, 200);

            console.info(
              `N5 Instant Neural Audio v22: ${available.size} pre-generated clips ready`
            );
          })();
          JAVASCRIPT

      - name: Create v23 runtime study fixes
        shell: bash
        run: |
          cat > _build/v23-fixes.js <<'JAVASCRIPT'
          (() => {
            "use strict";

            const $ = (q, root=document) => root.querySelector(q);

            function safeState() {
              try { return (typeof state !== "undefined") ? state : null; }
              catch { return null; }
            }

            function cancelEverything() {
              try {
                const st = safeState();
                if (st) st.sequenceToken = Number(st.sequenceToken || 0) + 1;
              } catch {}
              try { window.N5_INSTANT_AUDIO?.stop?.(); } catch {}
            }

            // ---- SRS / Recall: Bangla meaning + Bangla pronunciation hidden until Reveal.
            try {
              srsPrompt = function(card) {
                const phase = card.srs?.phase || "learn";
                if (phase === "use") {
                  return {
                    title: "USE",
                    prompt: `「${card.japanese}」 ব্যবহার করে একটি ছোট Japanese sentence লিখুন বা বলুন।`,
                    typed: true,
                    use: true
                  };
                }
                return {
                  title: phase === "learn" ? "LEARN / RECALL" : (phase === "review" ? "REVIEW" : "RECALL"),
                  prompt: `「${card.japanese}」 দেখে অর্থ ও উচ্চারণ মনে করুন। Natural Japanese sentence clue হিসেবে থাকবে। তারপর Reveal করুন।`
                };
              };

              offlineSrsCard = function(card) {
                const phase = card.srs?.phase || "learn";
                const p = srsPrompt(card);
                const r = state.srsRevealed;

                return `<div class="srs-study-card">
                  <div class="srs-card-top">
                    <div>
                      <span class="srs-phase phase-${phase}">${p.title}</span>
                      <span class="srs-due">${card.preview ? "Preview · " : ""}${dueText(card.srs?.due_at)}</span>
                    </div>
                    <div class="srs-counter">${state.srsIndex + 1}/${state.srsSession.length}</div>
                  </div>

                  <div class="srs-prompt">${esc(p.prompt)}</div>

                  <div class="srs-learn-box">
                    <div class="jp-word">${esc(card.japanese)}</div>
                    <div class="example" style="margin-top:12px">${esc(card.example.jp)}</div>
                    <button class="btn soft" id="${phase === "learn" ? "sla" : "sra"}" style="margin-top:10px">🔊 Japanese Voice</button>
                  </div>

                  ${p.typed ? `<div class="srs-answer-row">
                    <input id="srsAnswer" class="search-input" lang="ja" data-jp-input="1"
                           placeholder="${p.use ? "নিজের Japanese sentence লিখুন…" : "Japanese answer লিখুন…"}">
                    <button class="btn soft" id="micAnswer">🎙 Speak</button>
                  </div>` : ""}

                  ${!r ? `<button class="btn primary" id="revealSrs">Reveal বাংলা অর্থ + উচ্চারণ</button>` : ""}

                  ${r ? `<div class="srs-reveal">
                    <div class="eyebrow">ANSWER</div>
                    <div class="jp-word">${esc(card.japanese)}</div>
                    <div class="meaning">${esc(card.bangla_meaning)}</div>
                    <div class="pron">উচ্চারণ: ${esc(card.pronunciation_bn)}</div>
                    <div class="example">${esc(card.example.jp)}</div>
                    <div class="translation">${esc(card.example.bn)}</div>
                  </div>` : ""}

                  ${r ? `<div class="srs-rating">
                    <button data-rate="again" class="rate-again">Again<small>10 min</small></button>
                    <button data-rate="hard" class="rate-hard">Hard<small>shorter</small></button>
                    <button data-rate="good" class="rate-good">Good<small>normal</small></button>
                    <button data-rate="easy" class="rate-easy">Easy<small>longer</small></button>
                  </div>` : ""}
                </div>`;
              };
            } catch (e) {
              console.error("v23 SRS patch failed", e);
            }

            function enhanceSpelling() {
              const tools = $(".spell-tools");
              if (!tools || $("#skipSpell")) return;

              const btn = document.createElement("button");
              btn.className = "btn danger";
              btn.id = "skipSpell";
              btn.textContent = "Skip →";
              btn.title = "Skip without marking this word wrong";

              btn.onclick = () => {
                try {
                  state.spellingIndex++;
                  state.spellingResult = null;
                  state.spellingHint = false;

                  if (state.spellingIndex >= state.spellingSession.length) {
                    state.spellingSession = null;
                    toast("Spelling session complete ✓");
                    refresh();
                    showView("spelling");
                  } else {
                    renderSpelling();
                  }
                } catch (e) {
                  console.error("Skip failed", e);
                }
              };

              tools.appendChild(btn);
            }

            function playCoreAt(speed) {
              try {
                cancelEverything();
                const L = state.content;
                const dlg = L.dialogue_extended || L.dialogue || [];
                const core = dlg.map(x => x[1]).filter(Boolean);
                const pause = speed >= 3 ? 120 : speed >= 2 ? 180 : speed >= 1.5 ? 260 : 430;
                const wave = $("#wave");
                wave?.classList.add("playing");

                sequence(core, pause, speed, () => wave?.classList.remove("playing"));
              } catch (e) {
                console.error("High-speed listening failed", e);
              }
            }

            function enhanceListening() {
              const stopBtn = $("#lstop");
              const one = $("#lf");
              if (!stopBtn || !one) return;

              const toolbar = stopBtn.parentElement;
              if (!$("#l15")) {
                [
                  ["l15", "▶ 1.5×", 1.5],
                  ["l2",  "▶ 2×",   2],
                  ["l3",  "▶ 3×",   3],
                ].forEach(([id, label, speed]) => {
                  const b = document.createElement("button");
                  b.className = "btn glass";
                  b.id = id;
                  b.textContent = label;
                  b.onclick = () => playCoreAt(speed);
                  toolbar.insertBefore(b, stopBtn);
                });
              }

              // Ensure every new Start hard-cancels any previous sequence first.
              ["lb","ln","lf","listenCore","listenShadow","listenMarathon","vstream","sstream"].forEach(id => {
                const b = $("#" + id);
                if (!b || b.dataset.v23CancelBound) return;
                b.dataset.v23CancelBound = "1";
                b.addEventListener("click", cancelEverything, {capture:true});
              });

              if (!$("#singleStreamNotice")) {
                const firstStep = $(".shadow-step");
                if (firstStep) {
                  const notice = document.createElement("div");
                  notice.className = "shadow-step";
                  notice.id = "singleStreamNotice";
                  notice.style.borderColor = "#7ac7a8";
                  notice.style.background = "rgba(36,115,90,.18)";
                  notice.innerHTML = "<b>✓ Single-Stream Audio</b> — নতুন Start দিলে আগের Shadowing সম্পূর্ণ cancel হবে।";
                  firstStep.parentElement.insertBefore(notice, firstStep);
                }
              }
            }

            function enhanceRoadmap() {
              // Study Flow's 3rd card becomes a direct Listening shortcut.
              const flowCards = document.querySelectorAll("#view-overview .grid-3 .card");
              if (flowCards.length >= 3) {
                const card = flowCards[2];
                if (!card.dataset.v23Listening) {
                  card.dataset.v23Listening = "1";
                  card.style.cursor = "pointer";
                  card.setAttribute("role", "button");
                  card.setAttribute("tabindex", "0");
                  const h = card.querySelector("h3");
                  if (h) h.textContent = "Listen → Vocabulary";
                  const p = card.querySelector("p");
                  if (p) p.textContent = "ক্লিক করে নির্বাচিত Lesson-এর Vocabulary খুলুন →";
                  card.onclick = () => showView("vocabulary");
                  card.onkeydown = e => {
                    if (e.key === "Enter" || e.key === " ") showView("vocabulary");
                  };
                }
              }

              // Lesson Roadmap: choose lesson, then open its Vocabulary page.
              document.querySelectorAll("[data-jump]").forEach(b => {
                if (b.dataset.v23ListenJump) return;
                b.dataset.v23ListenJump = "1";
                b.onclick = () => {
                  setLesson(Number(b.dataset.jump));
                  showView("vocabulary");
                };
              });
            }

            function enhanceAll() {
              enhanceSpelling();
              enhanceListening();
              enhanceRoadmap();
            }

            const observer = new MutationObserver(() => enhanceAll());
            observer.observe(document.documentElement, {subtree:true, childList:true});

            setTimeout(enhanceAll, 0);

            // Safety: clicking STOP always invalidates all sequences.
            document.addEventListener("click", e => {
              if (e.target?.id === "lstop" || e.target?.id === "cstop" || e.target?.id === "rstop") {
                cancelEverything();
              }
            }, true);

            console.info("N5 v23 fixes loaded: single shadow stream, 3× listening, recall hidden, spelling skip, roadmap listening.");
          })();
          JAVASCRIPT

      - name: Create v24 strict single-voice queue
        shell: bash
        run: |
          cat > _build/v24-core-fix.js <<'JAVASCRIPT'
          (() => {
            "use strict";

            let queueGeneration = 0;

            function hardStopQueue() {
              queueGeneration += 1;
              try { window.speechSynthesis?.cancel?.(); } catch {}
              try { window.N5_INSTANT_AUDIO?.stop?.(); } catch {}
            }

            async function serialSequence(lines, pause = 600, rate = .88, done = null) {
              hardStopQueue();
              const mine = queueGeneration;
              const clean = Array.from(lines || []).map(x => String(x || "").trim()).filter(Boolean);

              for (const line of clean) {
                if (mine !== queueGeneration) return;

                // v24 speak() resolves only AFTER this MP3 ends.
                await window.N5_INSTANT_AUDIO.speak(line, rate, null, false);

                if (mine !== queueGeneration) return;

                if (pause > 0) {
                  await new Promise(resolve => setTimeout(resolve, pause));
                }
              }

              if (mine === queueGeneration) {
                try { done?.(); } catch {}
              }
            }

            try { sequence = serialSequence; } catch {}
            window.sequence = serialSequence;

            document.addEventListener("click", (e) => {
              const id = e.target?.id || "";
              if ([
                "lb","ln","lf","l15","l2","l3",
                "listenCore","listenShadow","listenMarathon",
                "vstream","sstream","cp","cs","csh",
                "rp","rs","rshadow","r2"
              ].includes(id)) {
                hardStopQueue();
              }
            }, true);

            document.addEventListener("click", (e) => {
              const id = e.target?.id || "";
              if (["lstop","cstop","rstop"].includes(id)) {
                hardStopQueue();
              }
            }, true);

            const updateNotice = () => {
              const n = document.querySelector("#singleStreamNotice");
              if (n) {
                n.innerHTML = "<b>✓ TRUE Single-Voice Queue</b> — একটি audio পুরো শেষ না হওয়া পর্যন্ত পরের line শুরু হবে না।";
              }
            };
            new MutationObserver(updateNotice).observe(document.documentElement, {childList:true, subtree:true});
            setTimeout(updateNotice, 0);

            console.info("N5 v24 strict serial audio queue enabled.");
          })();
          JAVASCRIPT

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -e

          cp index.html _site/index.html
          cp index.html _site/404.html
          cp .nojekyll _site/.nojekyll 2>/dev/null || true

          cp _build/audio-manifest.js _site/audio-manifest.js
          cp _build/instant-audio.js _site/instant-audio.js
          cp _build/v23-fixes.js _site/v23-fixes.js
          cp _build/v24-core-fix.js _site/v24-core-fix.js

          # Copy only generated MP3 files — no neural model ships to the phone.
          cp _audio_cache/*.mp3 _site/audio/

          python - <<'PYTHON'
          from pathlib import Path

          for filename in ["_site/index.html", "_site/404.html"]:
              path = Path(filename)
              html = path.read_text(encoding="utf-8")

              injection = """
              <script src="./audio-manifest.js"></script>
              <script src="./instant-audio.js"></script>
              <script src="./v23-fixes.js"></script>
              <script src="./v24-core-fix.js"></script>
              """

              if "v24-core-fix.js" not in html:
                  html = html.replace("</body>", injection + "\n</body>")

              html = html.replace(
                  "GitHub Single File · Mobile First · Romaji→Kana",
                  "GitHub Instant Audio v24 · TRUE Single Voice · Roadmap→Vocabulary"
              )

              path.write_text(html, encoding="utf-8")
          PYTHON

      - name: Verify instant-audio deployment
        shell: bash
        run: |
          set -e
          test -f _site/index.html
          test -f _site/audio-manifest.js
          test -f _site/instant-audio.js
          test -f _site/v23-fixes.js
          test -f _site/v24-core-fix.js
          test -d _site/audio
          test "$(find _site/audio -name '*.mp3' | wc -l)" -gt 1500
          grep -q "instant-audio.js" _site/index.html
          grep -q "v23-fixes.js" _site/index.html
          grep -q "v24-core-fix.js" _site/index.html
          grep -q "await new Promise((resolve)" _site/instant-audio.js
          grep -q "TRUE Single-Voice Queue" _site/v24-core-fix.js
          grep -q 'showView("vocabulary")' _site/v23-fixes.js
          grep -q "Single-Stream Audio" _site/v23-fixes.js
          grep -q "Skip →" _site/v23-fixes.js
          grep -q "▶ 3×" _site/v23-fixes.js
          echo "MP3 clips: $(find _site/audio -name '*.mp3' | wc -l)"
          echo "Published site size:"
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
