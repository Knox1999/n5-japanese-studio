            // ---------- True randomized lesson SRS ----------
            function srsRandom01() {
              try {
                const a = new Uint32Array(1);
                crypto.getRandomValues(a);
                return a[0] / 4294967296;
              } catch { return Math.random(); }
            }
          
            function srsShuffle(rows) {
              const a = [...rows];
              for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(srsRandom01() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
              }
              return a;
            }
          
            offlineSrsSession = function(lesson, newLimit = 8, limit = 20) {
              const rows = lessonRows(lesson), now = nowMs(), due = [], fresh = [], future = [];
              rows.forEach(v => {
                const st = state.srs[v.id];
                if (!st) fresh.push({ ...v, srs: srsDefault() });
                else {
                  const card = { ...v, srs: { ...st } };
                  if (st.due_at && new Date(st.due_at).getTime() <= now) due.push(card);
                  else future.push(card);
                }
              });
          
              // Due cards are kept in the session, but their presentation order is random.
              const dueRandom = srsShuffle(due).slice(0, limit);
              const freshRandom = srsShuffle(fresh);
              const futureRandom = srsShuffle(future);
              const cards = [...dueRandom];
              const slots = Math.max(0, limit - cards.length);
              cards.push(...freshRandom.slice(0, Math.min(slots, newLimit)));
              if (newLimit > 0 && cards.length < limit) {
                cards.push(...futureRandom.slice(0, limit - cards.length).map(x => ({ ...x, preview: true })));
              }
              return srsShuffle(cards);
            };
          
            startSrsSession = function(newLimit = 8) {
              state.srsSession = offlineSrsSession(state.lesson, newLimit, 20);
              if (!state.srsSession.length) {
                state.srsSession = null;
                toast(newLimit === 0 ? 'এখন কোনো Due card নেই।' : 'Session empty।');
