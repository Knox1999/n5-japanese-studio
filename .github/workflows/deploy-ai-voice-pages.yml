name: Deploy N5 Studio with GitHub-hosted Japanese AI Voice

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare static site
        shell: bash
        run: |
          set -e
          mkdir -p _site _build
          cp index.html _site/index.html
          cp index.html _site/404.html
          cp .nojekyll _site/.nojekyll 2>/dev/null || true

      - name: Install browser TTS dependencies
        shell: bash
        run: |
          set -e
          npm install --no-save \
            kokoro-js-jp@0.2.0 \
            @huggingface/transformers@3.8.1 \
            esbuild@0.25.9

      - name: Create N5 neural TTS browser engine
        shell: bash
        run: |
          cat > _build/tts-entry.js <<'JAVASCRIPT'
          import { KokoroJP } from "kokoro-js-jp";
          import { env } from "@huggingface/transformers";

          const MODEL_ID = "onnx-community/Kokoro-82M-v1.0-ONNX";
          const AUDIO_CACHE = "n5-kokoro-japanese-audio-v1";

          const VOICES = [
            ["jf_alpha", "Natural Alpha · Female"],
            ["jf_gongitsune", "Natural Gongitsune · Female"],
            ["jf_nezumi", "Natural Nezumi · Female"],
            ["jf_tebukuro", "Natural Tebukuro · Female"],
            ["jm_kumo", "Natural Kumo · Male"],
          ];

          let enginePromise = null;
          let currentAudio = null;
          let currentObjectUrl = null;
          let generationId = 0;

          const originalSpeak = window.speak;
          const originalStopSpeech = window.stopSpeech;

          function $(selector) {
            return document.querySelector(selector);
          }

          function setStatus(message, type = "") {
            const el = $("#aiVoiceStatus");
            if (!el) return;
            el.textContent = message;
            el.className = "voice-status " + type;
          }

          function sitePath(relative) {
            return new URL(relative, document.baseURI).pathname;
          }

          function configureLocalRuntime() {
            // Everything is served from this GitHub Pages deployment.
            env.allowLocalModels = true;
            env.allowRemoteModels = false;
            env.localModelPath = sitePath("./models/");
            env.useBrowserCache = true;
            env.backends.onnx.wasm.wasmPaths = sitePath("./ort/");
          }

          async function getEngine() {
            if (enginePromise) return enginePromise;

            enginePromise = (async () => {
              setStatus("AI voice loading… first use may take a few minutes.", "warn");
              configureLocalRuntime();

              const tts = await KokoroJP.load({
                modelId: MODEL_ID,
                dtype: "q8",
                device: "wasm",
                japanese: {
                  assetsUrl: new URL("./kokoro-js-jp", document.baseURI).href.replace(/\/$/, ""),
                },
              });

              setStatus("✓ Japanese Neural Voice ready · GitHub-hosted", "ready");
              return tts;
            })().catch((err) => {
              console.error("Kokoro Japanese TTS load failed:", err);
              enginePromise = null;
              setStatus("AI voice failed to load. Reload once and try again.", "warn");
              throw err;
            });

            return enginePromise;
          }

          async function sha256(text) {
            const bytes = new TextEncoder().encode(text);
            const digest = await crypto.subtle.digest("SHA-256", bytes);
            return [...new Uint8Array(digest)]
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
          }

          async function getCachedAudio(key) {
            if (!("caches" in window)) return null;
            const cache = await caches.open(AUDIO_CACHE);
            const response = await cache.match(new Request("./__tts_cache__/" + key + ".wav"));
            return response ? await response.blob() : null;
          }

          async function putCachedAudio(key, blob) {
            if (!("caches" in window)) return;
            try {
              const cache = await caches.open(AUDIO_CACHE);
              await cache.put(
                new Request("./__tts_cache__/" + key + ".wav"),
                new Response(blob, { headers: { "Content-Type": "audio/wav" } })
              );
            } catch (err) {
              console.warn("Audio cache write skipped:", err);
            }
          }

          function stopAiAudio() {
            generationId += 1;

            try {
              if (typeof originalStopSpeech === "function") {
                originalStopSpeech();
              }
            } catch {}

            if (currentAudio) {
              try {
                currentAudio.pause();
                currentAudio.currentTime = 0;
              } catch {}
              currentAudio = null;
            }

            if (currentObjectUrl) {
              try {
                URL.revokeObjectURL(currentObjectUrl);
              } catch {}
              currentObjectUrl = null;
            }
          }

          async function playBlob(blob, runId) {
            if (runId !== generationId) return;

            currentObjectUrl = URL.createObjectURL(blob);
            currentAudio = new Audio(currentObjectUrl);

            await new Promise((resolve, reject) => {
              currentAudio.onended = resolve;
              currentAudio.onerror = reject;
              currentAudio.play().catch(reject);
            }).finally(() => {
              if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
              }
              currentAudio = null;
            });
          }

          async function neuralSpeak(text, rate = null, onend = null, interrupt = true) {
            text = String(text || "").trim();
            if (!text) {
              if (onend) onend();
              return;
            }

            if (interrupt) stopAiAudio();
            const runId = generationId;

            const voice = $("#aiVoiceSelect")?.value || "jf_alpha";
            const speed = Number(rate ?? $("#rate")?.value ?? 0.92);
            const cacheKey = await sha256([voice, speed.toFixed(2), text].join("|"));

            try {
              let blob = await getCachedAudio(cacheKey);

              if (!blob) {
                const tts = await getEngine();
                if (runId !== generationId) return;

                setStatus("Generating natural Japanese audio…", "warn");
                const rawAudio = await tts.speak(text, voice, speed);
                blob = rawAudio.toBlob();
                await putCachedAudio(cacheKey, blob);
              }

              if (runId !== generationId) return;
              await playBlob(blob, runId);
              setStatus("✓ Japanese Neural Voice ready · audio cached", "ready");
              if (onend) onend();
            } catch (err) {
              console.error("Neural speech error:", err);
              setStatus("Could not generate this audio. Tap Voice Test and retry.", "warn");
              // Intentionally do NOT fall back to the robotic system voice.
              if (onend) onend();
            }
          }

          async function clearAudioCache() {
            if ("caches" in window) {
              await caches.delete(AUDIO_CACHE);
            }
            setStatus("Generated-audio cache cleared. Model files remain browser-cached.", "ready");
          }

          function installVoiceUI() {
            const panel = document.querySelector(".voice-panel");
            if (!panel) return;

            panel.innerHTML = `
              <div class="eyebrow">NATURAL JAPANESE AI VOICE</div>
              <select id="aiVoiceSelect" class="select">
                ${VOICES.map(([id, name]) => `<option value="${id}">${name}</option>`).join("")}
              </select>
              <select id="voiceSelect" hidden aria-hidden="true"></select>
              <div class="voice-status warn" id="aiVoiceStatus">AI voice loads on first Play.</div>
              <div class="ai-voice-note">First use downloads the GitHub-hosted neural model. Later playback is cached on this device.</div>
              <div class="rate-row">
                <span>Speed</span>
                <input type="range" id="rate" min=".68" max="1.08" step=".02" value=".92">
                <b id="rateValue">0.92×</b>
              </div>
              <div class="ai-voice-buttons">
                <button class="btn red" id="voiceTestBtn">▶ Natural Voice Test</button>
                <button class="btn soft" id="clearAiVoiceCache">Clear Audio Cache</button>
              </div>
            `;

            const savedVoice = localStorage.getItem("n5_ai_voice") || "jf_alpha";
            const select = $("#aiVoiceSelect");
            if (select && VOICES.some(([id]) => id === savedVoice)) {
              select.value = savedVoice;
            }

            select?.addEventListener("change", (event) => {
              localStorage.setItem("n5_ai_voice", event.target.value);
              stopAiAudio();
            });

            const rate = $("#rate");
            const rateValue = $("#rateValue");
            rate?.addEventListener("input", () => {
              if (rateValue) rateValue.textContent = `${Number(rate.value).toFixed(2)}×`;
            });

            $("#voiceTestBtn")?.addEventListener("click", () => {
              neuralSpeak("こんにちは。きょうも いっしょに にほんごを れんしゅうしましょう。", 0.92);
            });

            $("#clearAiVoiceCache")?.addEventListener("click", clearAudioCache);
          }

          function addStyles() {
            const style = document.createElement("style");
            style.textContent = `
              .ai-voice-note{
                margin-top:8px;padding:8px 9px;border-radius:10px;
                background:#eef6fb;border:1px solid #d2e4ef;
                color:#315d79;font-size:9px;line-height:1.45
              }
              .ai-voice-buttons{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
              #aiVoiceSelect{font-size:10px}
              @media(max-width:820px){
                .ai-voice-note{font-size:10px}
                #aiVoiceSelect{font-size:16px}
                .ai-voice-buttons .btn{min-height:42px}
              }
            `;
            document.head.appendChild(style);
          }

          addStyles();
          installVoiceUI();

          // Replace the old browser/system TTS globally.
          window.speak = neuralSpeak;
          window.stopSpeech = stopAiAudio;
          window.N5_AI_TTS = {
            getEngine,
            speak: neuralSpeak,
            stop: stopAiAudio,
            clearAudioCache,
            voices: VOICES,
          };

          console.info("N5 Japanese Studio: GitHub-hosted Kokoro Japanese AI Voice enabled.");
          JAVASCRIPT

          npx esbuild _build/tts-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --minify \
            --outfile=_site/tts-engine.js

      - name: Copy Japanese Open JTalk browser assets
        shell: bash
        run: |
          set -e
          npx kokoro-js-jp-copy-assets _site/kokoro-js-jp
          du -sh _site/kokoro-js-jp

      - name: Copy ONNX Runtime Web files into GitHub Pages
        shell: bash
        run: |
          set -e
          mkdir -p _site/ort
          find node_modules \
            -path '*/onnxruntime-web/dist/ort-wasm*' \
            -type f \
            -exec cp -f {} _site/ort/ \;
          echo "Local ONNX Runtime files:"
          ls -lh _site/ort

      - name: Download Kokoro model + Japanese voices into GitHub Pages
        shell: bash
        run: |
          set -e
          python -m pip install --quiet "huggingface_hub>=0.34,<1.0"

          python - <<'PYTHON'
          from huggingface_hub import hf_hub_download
          from pathlib import Path

          repo_id = "onnx-community/Kokoro-82M-v1.0-ONNX"
          local_dir = Path("_site/models/onnx-community/Kokoro-82M-v1.0-ONNX")

          files = [
              "config.json",
              "tokenizer.json",
              "tokenizer_config.json",
              "onnx/model_quantized.onnx",
              "voices/jf_alpha.bin",
              "voices/jf_gongitsune.bin",
              "voices/jf_nezumi.bin",
              "voices/jf_tebukuro.bin",
              "voices/jm_kumo.bin",
          ]

          for filename in files:
              print("Downloading:", filename, flush=True)
              hf_hub_download(
                  repo_id=repo_id,
                  filename=filename,
                  local_dir=str(local_dir),
              )

          print("Kokoro model files ready:", local_dir)
          PYTHON

      - name: Inject neural TTS module into N5 Studio
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path

          for filename in ["_site/index.html", "_site/404.html"]:
              path = Path(filename)
              html = path.read_text(encoding="utf-8")

              module = '\n<script type="module" src="./tts-engine.js"></script>\n'
              marker = "</body>"

              if "tts-engine.js" not in html:
                  html = html.replace(marker, module + marker)

              # The old single-file build has no active service-worker registration;
              # keep the GitHub Pages AI build explicit.
              html = html.replace(
                  "GitHub Single File · Mobile First · Romaji→Kana",
                  "GitHub AI Voice · Mobile First · Romaji→Kana"
              )

              path.write_text(html, encoding="utf-8")
          PYTHON

      - name: Verify deployment files
        shell: bash
        run: |
          set -e
          test -f _site/index.html
          test -f _site/tts-engine.js
          test -f _site/kokoro-js-jp/open_jtalk_dic_utf_8-1.11.tar.gz
          test -f _site/models/onnx-community/Kokoro-82M-v1.0-ONNX/onnx/model_quantized.onnx
          test -f _site/models/onnx-community/Kokoro-82M-v1.0-ONNX/voices/jf_alpha.bin
          grep -q 'tts-engine.js' _site/index.html
          echo "Deployment size:"
          du -sh _site
          echo "Largest files:"
          find _site -type f -printf '%s %p\n' | sort -nr | head -15

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
