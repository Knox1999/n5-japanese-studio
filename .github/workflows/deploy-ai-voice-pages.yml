name: Deploy N5 Studio — Clean Stable Instant Audio v26

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore generated-audio cache
        uses: actions/cache@v4
        with:
          path: _audio_cache
          key: n5-kokoro-jf-alpha-v22-${{ hashFiles('index.html') }}
          restore-keys: |
            n5-kokoro-jf-alpha-v22-

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-japanese-v1
          restore-keys: |
            kokoro-82m-japanese-

      - name: Install build-time Japanese neural TTS
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install \
            "kokoro>=0.9.4,<1.0" \
            "misaki[ja]>=0.9.4,<1.0" \
            "soundfile>=0.12" \
            "numpy>=1.26,<3"

          # Misaki Japanese second-gen G2P expects the full UniDic dictionary.
          # This happens only on the GitHub Actions builder, never on the phone.
          python -m unidic download

      - name: Extract every fixed study text that needs audio
        shell: bash
        run: |
          mkdir -p _build _site _audio_cache

          cat > _build/extract_audio_texts.py <<'PYTHON'
          import hashlib, json, re, unicodedata
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          m = re.search(
              r'window\.N5_OFFLINE_DATA\s*=\s*(\{.*?\});\s*</script>',
              html,
              re.S,
          )
          if not m:
              raise SystemExit("Could not find embedded N5_OFFLINE_DATA in index.html")

          data = json.loads(m.group(1))
          items = {}

          def norm(text):
              text = unicodedata.normalize("NFC", str(text or ""))
              return re.sub(r"\s+", " ", text).strip()

          def add(text, lesson=0, kind="misc"):
              text = norm(text)
              if not text:
                  return
              key = hashlib.sha1(text.encode("utf-8")).hexdigest()
              row = items.setdefault(key, {
                  "hash": key,
                  "text": text,
                  "lessons": [],
                  "kinds": [],
              })
              if lesson and int(lesson) not in row["lessons"]:
                  row["lessons"].append(int(lesson))
              if kind not in row["kinds"]:
                  row["kinds"].append(kind)

          # Vocabulary + 1,011 curated natural sentences.
          for v in data.get("vocabulary", []):
              lesson = int(v.get("lesson") or 0)
              add(v.get("tts_text") or v.get("japanese"), lesson, "vocab")
              add(v.get("spelling_text"), lesson, "spelling")
              ex = v.get("example") or {}
              if isinstance(ex, dict):
                  add(ex.get("jp") or ex.get("japanese"), lesson, "sentence")

          # Lesson-fixed conversation / reading / shadowing / grammar.
          lessons = (data.get("content") or {}).get("lessons") or {}
          for lesson_key, L in lessons.items():
              lesson = int(lesson_key)

              for name in ("dialogue", "dialogue_extended"):
                  for turn in L.get(name) or []:
                      if isinstance(turn, list) and len(turn) > 1:
                          add(turn[1], lesson, "conversation")

              for name in ("reading", "reading_extended"):
                  add(L.get(name), lesson, "reading_full")

              for chunk in L.get("shadowing_chunks") or []:
                  add(chunk, lesson, "shadow")

              for pair in L.get("reading_extra_pairs") or []:
                  if isinstance(pair, list) and pair:
                      add(pair[0], lesson, "reading_sentence")

              for grammar in L.get("grammar") or []:
                  if isinstance(grammar, list) and len(grammar) > 2:
                      add(grammar[2], lesson, "grammar")

          # Voice test.
          add(
              "こんにちは。きょうも いっしょに にほんごを れんしゅうしましょう。",
              0,
              "voice_test",
          )

          # Sentence-level splits of full readings so sentence shadowing never
          # has to generate at runtime.
          sentence_split = re.compile(r"(?<=[。！？])")
          for row in list(items.values()):
              if "reading_full" in row["kinds"]:
                  for sentence in sentence_split.split(row["text"]):
                      sentence = norm(sentence)
                      if sentence:
                          for lesson in row["lessons"] or [0]:
                              add(sentence, lesson, "reading_sentence")

          rows = sorted(items.values(), key=lambda x: x["hash"])
          Path("_build/audio_texts.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          per_lesson = {str(i): [] for i in range(1, 26)}
          for row in rows:
              for lesson in row["lessons"]:
                  if str(lesson) in per_lesson:
                      per_lesson[str(lesson)].append(row["hash"])

          Path("_build/lesson_audio.json").write_text(
              json.dumps(per_lesson, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(f"Unique fixed Japanese audio clips: {len(rows)}")
          for i in range(1, 26):
              print(f"L{i:02d}: {len(per_lesson[str(i)])} clips")
          PYTHON

          python _build/extract_audio_texts.py

      - name: Pre-generate natural Japanese MP3 with Kokoro
        shell: bash
        run: |
          cat > _build/generate_audio.py <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          import numpy as np
          import soundfile as sf
          import torch
          from kokoro import KPipeline

          VOICE = "jf_alpha"
          SPEED = 0.94
          SAMPLE_RATE = 24000

          rows = json.loads(Path("_build/audio_texts.json").read_text(encoding="utf-8"))
          out_dir = Path("_audio_cache")
          out_dir.mkdir(parents=True, exist_ok=True)

          # Let PyTorch use the runner CPUs efficiently.
          cpu_count = max(1, os.cpu_count() or 2)
          torch.set_num_threads(cpu_count)
          print("CPU threads:", cpu_count, flush=True)

          print("Loading Kokoro Japanese pipeline once...", flush=True)
          pipeline = KPipeline(lang_code="j")
          print("Kokoro ready.", flush=True)

          generated = 0
          reused = 0
          failed = []

          for idx, row in enumerate(rows, 1):
              key = row["hash"]
              text = row["text"]
              final_mp3 = out_dir / f"{key}.mp3"

              if final_mp3.exists() and final_mp3.stat().st_size > 1000:
                  reused += 1
                  continue

              try:
                  parts = []
                  for _, _, audio in pipeline(
                      text,
                      voice=VOICE,
                      speed=SPEED,
                  ):
                      if hasattr(audio, "detach"):
                          audio = audio.detach().cpu().numpy()
                      audio = np.asarray(audio, dtype=np.float32).reshape(-1)
                      if audio.size:
                          parts.append(audio)

                  if not parts:
                      raise RuntimeError("Kokoro returned no audio")

                  # Kokoro may chunk long readings. Add a small natural pause
                  # between model chunks, not between normal shadowing lines.
                  if len(parts) == 1:
                      merged = parts[0]
                  else:
                      pause = np.zeros(int(SAMPLE_RATE * 0.12), dtype=np.float32)
                      joined = []
                      for j, part in enumerate(parts):
                          if j:
                              joined.append(pause)
                          joined.append(part)
                      merged = np.concatenate(joined)

                  with tempfile.TemporaryDirectory() as td:
                      wav = Path(td) / "clip.wav"
                      mp3 = Path(td) / "clip.mp3"
                      sf.write(wav, merged, SAMPLE_RATE, subtype="PCM_16")
                      subprocess.run([
                          "ffmpeg", "-loglevel", "error", "-y",
                          "-i", str(wav),
                          "-ac", "1",
                          "-ar", "24000",
                          "-codec:a", "libmp3lame",
                          "-b:a", "64k",
                          str(mp3),
                      ], check=True)
                      mp3.replace(final_mp3)

                  generated += 1

              except Exception as exc:
                  failed.append((key, text, repr(exc)))
                  print(f"\nFAILED {key}: {text}\n{exc}", flush=True)

              if idx % 25 == 0 or idx == len(rows):
                  print(
                      f"[{idx}/{len(rows)}] generated={generated} reused={reused} failed={len(failed)}",
                      flush=True,
                  )

          if failed:
              Path("_build/audio_failures.json").write_text(
                  json.dumps(failed, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              # A tiny number of unusual strings should not destroy the whole
              # site; runtime will clearly report missing audio for those.
              if len(failed) > 20:
                  raise SystemExit(f"Too many TTS failures: {len(failed)}")

          print("DONE", {"generated": generated, "reused": reused, "failed": len(failed)})
          PYTHON

          python _build/generate_audio.py

      - name: Build instant static-audio manifest
        shell: bash
        run: |
          cat > _build/build_manifest.py <<'PYTHON'
          import json
          from pathlib import Path

          rows = json.loads(Path("_build/audio_texts.json").read_text(encoding="utf-8"))
          per_lesson = json.loads(Path("_build/lesson_audio.json").read_text(encoding="utf-8"))

          available = {
              p.stem for p in Path("_audio_cache").glob("*.mp3")
              if p.stat().st_size > 1000
          }

          manifest = {
              "version": "22",
              "voice": "jf_alpha",
              "speed": 0.94,
              "count": len(available),
              "hashes": sorted(available),
          }

          Path("_build/audio-manifest.js").write_text(
              "window.N5_STATIC_AUDIO_MANIFEST=" +
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) +
              ";\n",
              encoding="utf-8",
          )

          audio_dir = Path("_site/audio")
          audio_dir.mkdir(parents=True, exist_ok=True)

          for lesson, hashes in per_lesson.items():
              hashes = [h for h in hashes if h in available]
              (audio_dir / f"lesson-{int(lesson):02d}.json").write_text(
                  json.dumps(hashes, separators=(",", ":")),
                  encoding="utf-8",
              )

          print("Static audio manifest clips:", len(available))
          PYTHON

          python _build/build_manifest.py

      - name: Build clean v26 browser app
        shell: bash
        run: |
          cat > _build/instant-audio-v26.js <<'JAVASCRIPT'
          (() => {
            "use strict";

            const manifest = window.N5_STATIC_AUDIO_MANIFEST || { hashes: [] };
            const available = new Set(manifest.hashes || []);
            const base = new URL("./audio/", document.baseURI);

            let audioCtx = null;
            let currentSource = null;
            let playToken = 0;
            const decoded = new Map();
            const MAX_MEMORY_CACHE = 56;

            const $ = (q) => document.querySelector(q);

            function normalizeText(text) {
              return String(text || "").normalize("NFC").replace(/\s+/g, " ").trim();
            }

            async function sha1(text) {
              const bytes = new TextEncoder().encode(normalizeText(text));
              const digest = await crypto.subtle.digest("SHA-1", bytes);
              return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
            }

            function getContext() {
              if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) throw new Error("Web Audio API not supported");
                audioCtx = new Ctx({ latencyHint: "interactive" });
              }
              return audioCtx;
            }

            async function unlock() {
              const ctx = getContext();
              if (ctx.state !== "running") await ctx.resume();
              const b = ctx.createBuffer(1, 1, ctx.sampleRate);
              const s = ctx.createBufferSource();
              s.buffer = b; s.connect(ctx.destination); s.start();
            }

            function setStatus(text, cls = "") {
              const el = $("#instantVoiceStatus");
              if (!el) return;
              el.textContent = text;
              el.className = "voice-status " + cls;
            }

            function stop() {
              playToken += 1;
              try { speechSynthesis.cancel(); } catch {}
              try {
                if (typeof state !== "undefined") {
                  state.sequenceToken = Number(state.sequenceToken || 0) + 1;
                }
              } catch {}
              if (currentSource) {
                const s = currentSource;
                currentSource = null;
                try { s.stop(0); } catch {}
                try { s.disconnect(); } catch {}
              }
            }

            async function getBuffer(hash) {
              if (decoded.has(hash)) return decoded.get(hash);
              const ctx = getContext();
              const response = await fetch(new URL(`${hash}.mp3`, base), { cache: "force-cache" });
              if (!response.ok) throw new Error(`Audio HTTP ${response.status}`);
              const bytes = await response.arrayBuffer();
              const buffer = await ctx.decodeAudioData(bytes.slice(0));
              if (decoded.size >= MAX_MEMORY_CACHE) decoded.delete(decoded.keys().next().value);
              decoded.set(hash, buffer);
              return buffer;
            }

            async function speakInstant(text, rate = null, onend = null, interrupt = true) {
              text = normalizeText(text);
              if (!text) { try { onend?.(); } catch {} return; }

              if (interrupt) stop();
              const token = playToken;
              try { await unlock(); } catch {}

              const hash = await sha1(text);
              if (!available.has(hash)) {
                console.warn("No pre-generated audio for:", text);
                setStatus("এই rare line-এর pre-generated audio পাওয়া যায়নি।", "warn");
                try { onend?.(); } catch {}
                return;
              }

              try {
                const buffer = await getBuffer(hash);
                if (token !== playToken) return;

                const ctx = getContext();
                if (ctx.state !== "running") await ctx.resume();
                if (token !== playToken) return;

                const node = ctx.createBufferSource();
                currentSource = node;
                node.buffer = buffer;
                const requested = Number(rate ?? $("#rate")?.value ?? 0.94);
                node.playbackRate.value = Math.max(0.50, Math.min(3.20, requested / 0.94));
                node.connect(ctx.destination);

                // Critical: resolve only after THIS clip actually ends.
                await new Promise((resolve) => {
                  let settled = false;
                  const finish = () => {
                    if (settled) return;
                    settled = true;
                    if (currentSource === node) currentSource = null;
                    try { node.disconnect(); } catch {}
                    try { onend?.(); } catch {}
                    resolve();
                  };
                  node.onended = finish;
                  try {
                    node.start(0);
                    setStatus("✓ Instant Natural Voice · single-stream", "ready");
                  } catch (err) {
                    console.error("Audio source start failed:", err);
                    finish();
                  }
                });
              } catch (err) {
                console.error("Static audio playback error:", err);
                setStatus("Audio play হয়নি। Reload করে Voice Test দিন।", "warn");
                try { onend?.(); } catch {}
              }
            }

            async function prefetchLesson(lesson) {
              lesson = Number(lesson || 1);
              if (lesson < 1 || lesson > 25) return;
              try {
                const listUrl = new URL(`lesson-${String(lesson).padStart(2, "0")}.json`, base);
                const res = await fetch(listUrl, { cache: "force-cache" });
                if (!res.ok) return;
                const hashes = await res.json();
                let i = 0;
                const workers = Array.from({ length: 3 }, async () => {
                  while (i < hashes.length) {
                    const hash = hashes[i++];
                    try { await fetch(new URL(`${hash}.mp3`, base), { cache: "force-cache" }); } catch {}
                  }
                });
                await Promise.all(workers);
                setStatus(`✓ Lesson ${lesson} audio cached`, "ready");
              } catch (err) {
                console.warn("Lesson prefetch skipped:", err);
              }
            }

            function installUI() {
              const panel = document.querySelector(".voice-panel");
              if (!panel) return;
              try { speechSynthesis.cancel(); speechSynthesis.onvoiceschanged = null; } catch {}
              panel.innerHTML = `
                <div class="eyebrow">NATURAL JAPANESE AUDIO</div>
                <div class="voice-status ready" id="instantVoiceStatus">✓ Pre-generated neural audio · ready</div>
                <div class="instant-voice-note">No live AI generation. Lesson audio is cached in the background.</div>
                <div class="rate-row"><span>Speed</span><input type="range" id="rate" min=".60" max="3.00" step=".05" value=".94"><b id="rateValue">0.94×</b></div>
                <button class="btn red" id="voiceTestBtn" style="width:100%;margin-top:8px">▶ Voice Test</button>`;

              const rate = $("#rate"), out = $("#rateValue");
              rate?.addEventListener("input", () => { if (out) out.textContent = `${Number(rate.value).toFixed(2)}×`; });
              $("#voiceTestBtn")?.addEventListener("click", () => speakInstant("こんにちは。きょうも いっしょに にほんごを れんしゅうしましょう。", .94));
            }

            installUI();
            window.speak = speakInstant;
            window.stopSpeech = stop;
            window.N5_INSTANT_AUDIO = { speak: speakInstant, stop, prefetchLesson, manifest };

            setTimeout(() => prefetchLesson($("#lessonSelect")?.value || 1), 1200);
            console.info(`N5 Clean Instant Audio v26: ${available.size} clips`);
          })();

          JAVASCRIPT

          cat > _build/app-clean-v26.js <<'JAVASCRIPT'
          (() => {
            "use strict";

            // Remove legacy PWA workers/caches from older GitHub Pages editions.
            try {
              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
              }
            } catch {}

            document.documentElement.dataset.build = "clean-v26";

            // ---------- Clean view navigation ----------
            showView = function(name, opts = {}) {
              state.view = name;
              $$(".view").forEach(v => v.classList.toggle("active", v.id === `view-${name}`));
              $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
              setMobileDockActive(name);
              if (name === "history") renderHistory();
              if (window.matchMedia("(max-width:820px)").matches) closeMobileMenu();
              if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: opts.instant ? "auto" : "smooth" });
            };

            // Select a lesson and optionally open its target view.
            setLesson = function(n, targetView = "overview") {
              state.lesson = n;
              localStorage.setItem(KEYS.lesson, n);
              state.mock = null; state.result = null; state.answers = {};
              state.srsSession = null; state.srsIndex = 0; state.srsRevealed = false;
              state.spellingSession = null; state.spellingIndex = 0; state.spellingResult = null;
              state.klcSelected = null; state.klcLessonMode = "appearance";
              stopSpeech();
              refresh();
              showView(targetView, { instant: true });
              try { window.N5_INSTANT_AUDIO?.prefetchLesson?.(n); } catch {}
            };

            // ---------- Overview / Roadmap ----------
            renderOverview = function() {
              const L = state.content, rows = state.vocab;
              const done = rows.filter(v => v.mastered).length;
              const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
              const avg = state.history.length ? Math.round(state.history.reduce((a, x) => a + x.score, 0) / state.history.length) : 0;
              const srs = offlineSrsSummary(state.lesson);

              $("#view-overview").innerHTML = `
                <div class="hero"><div class="eyebrow" style="color:#ffd879">${lessonLabel(state.lesson)} · NATURAL STUDY</div><h1>${esc(L.title)}</h1><p>${esc(L.scenario)}। Vocabulary → Recall → Use → Review → Listening flow-এ পড়ুন।</p><div class="pills"><span class="pill">Vocabulary</span><span class="pill">Active Recall</span><span class="pill">Reading + Listening</span><span class="pill">Adaptive Review</span></div></div>
                <div class="stats"><div class="stat"><strong>${rows.length}</strong><span>Vocabulary</span></div><div class="stat"><strong>${done}</strong><span>Mastered</span></div><div class="stat"><strong>${pct}%</strong><span>Progress</span><div class="progress"><i style="width:${pct}%"></i></div></div><div class="stat"><strong>${avg}%</strong><span>Mock Average</span></div></div>
                <div class="srs-mini-banner"><div><div class="eyebrow">ADAPTIVE REVIEW</div><h3>${srs.due} Due · ${srs.new} New</h3><p>Recall first. বাংলা answer Reveal-এর আগে hidden থাকবে।</p></div><button class="btn red" id="quickSrs">↻ Start SRS</button></div>
                <div class="section-head"><div><h2>Study Flow</h2><p>Simple, focused, repeatable.</p></div><button class="btn primary" id="quickMock">✓ 100Q Lesson Mock</button></div>
                <div class="grid-3 clean-flow"><div class="card"><div class="eyebrow">01</div><h3>Learn + Spell</h3><p>Vocabulary বুঝুন, তারপর kana লিখে recall করুন।</p></div><div class="card"><div class="eyebrow">02</div><h3>Read + Use</h3><p>Conversation ও reading দিয়ে context তৈরি করুন।</p></div><div class="card"><div class="eyebrow">03</div><h3>Listen + Review</h3><p>Single-stream shadowing শেষে SRS ও mock দিন।</p></div></div>
                <div class="section-head roadmap-head"><div><h2>Lesson Vocabulary Roadmap</h2><p>যে Lesson-এ click করবেন, সরাসরি সেই Lesson-এর Vocabulary খুলবে।</p></div></div>
                <div class="lesson-grid">${lessonSummary().map(x => `<button class="lesson-tile ${x.lesson === state.lesson ? "current" : ""}" data-jump="${x.lesson}"><b>L${String(x.lesson).padStart(2, "0")} · ${x.count} words</b><span>${esc(x.title)}</span></button>`).join("")}</div>`;

              $$("[data-jump]").forEach(b => b.onclick = () => setLesson(Number(b.dataset.jump), "vocab"));
              $("#quickSrs").onclick = () => startSrsSession(8);
              $("#quickMock").onclick = () => { showView("mock"); startMock("lesson", state.lesson); };
            };

            // ---------- Clean vocabulary + no scroll jump on mastery ----------
            vocabCard = function(v) {
              return `<article class="vocab-card ${v.mastered ? "mastered-card" : ""}" data-id="${v.id}"><div><div class="word-line"><div class="jp-word">${esc(v.japanese)}</div>${v.kanji ? `<span class="kanji-inline">${esc(v.kanji)}</span>` : ""}</div><div class="meaning meaning-sensitive">${esc(v.bangla_meaning)}</div><div class="english meaning-sensitive">${esc(v.english_meaning)}</div><div class="pron meaning-sensitive">উচ্চারণ: ${esc(v.pronunciation_bn)}</div><span class="type-chip">${esc(v.word_type)}</span></div><div><div class="sentence-label">NATURAL SENTENCE</div><div class="example">${esc(v.example.jp)}</div><div class="translation meaning-sensitive">${esc(v.example.bn)}</div>${v.example.grammar_zone ? `<div class="grammar-focus">${esc(v.example.grammar_zone)}</div>` : ""}<div class="meta">Word #${v.word_no}</div></div><div class="actions"><button class="icon wa" title="Word audio">🔊</button><button class="icon sa" title="Sentence audio">🎧</button><button class="icon ma ${v.mastered ? "done" : ""}" title="Toggle mastered">${v.mastered ? "✓" : "○"}</button><button class="icon mo" title="Details">↗</button></div></article>`;
            };

            renderVocab = function(filter = "") {
              const q = filter.toLowerCase().trim();
              const rows = state.vocab.filter(v => `${v.japanese} ${v.pronunciation_bn} ${v.kanji} ${v.english_meaning} ${v.bangla_meaning}`.toLowerCase().includes(q));
              $("#view-vocab").innerHTML = `<div class="section-head"><div><div class="eyebrow">LESSON ${String(state.lesson).padStart(2, "0")} VOCABULARY</div><h2>শব্দ + Natural বাক্য</h2><p>${state.vocab.length} words · Mastery click করলে scroll position বদলাবে না।</p></div><button class="btn soft" id="playWords">▶ Word Stream</button></div><div class="toolbar"><input class="search-input" id="vocabSearch" placeholder="এই Lesson-এ search…"><span class="meta">${rows.length} entries</span></div><div class="vocab-list">${rows.map(vocabCard).join("")}</div>`;
              $("#vocabSearch").value = filter;
              $("#vocabSearch").oninput = e => renderVocab(e.target.value);
              $("#playWords").onclick = () => sequence(state.vocab.map(v => v.tts_text), 380, .82);

              $$(".vocab-card").forEach(card => {
                const v = state.vocab.find(x => x.id === Number(card.dataset.id));
                $(".wa", card).onclick = () => speak(v.tts_text);
                $(".sa", card).onclick = () => speak(v.example.jp);
                $(".ma", card).onclick = () => {
                  const on = !state.progress[v.id];
                  state.progress[v.id] = on;
                  v.mastered = on;
                  saveProgress();
                  const b = $(".ma", card);
                  b.classList.toggle("done", on);
                  b.textContent = on ? "✓" : "○";
                  card.classList.toggle("mastered-card", on);
                  renderOverview();
                  toast(on ? "Mastered ✓" : "Learning mode");
                };
                $(".mo", card).onclick = () => openWord(v);
              });
              applyModes();
            };

            // ---------- Spelling skip ----------
            const originalSpellingCardHTML = spellingCardHTML;
            spellingCardHTML = function(card) {
              return originalSpellingCardHTML(card).replace(
                '<button class="btn soft" id="spellShow">👁 Show</button></div>',
                '<button class="btn soft" id="spellShow">👁 Show</button><button class="btn danger" id="skipSpell">Skip →</button></div>'
              );
            };

            bindSpellingCard = function(card) {
              $("#endSpell").onclick = () => { state.spellingSession = null; state.spellingIndex = 0; state.spellingResult = null; renderSpelling(); };
              activateJapaneseInputs($("#view-spelling"));
              const input = $("#spellInput"); setTimeout(() => input?.focus(), 30);
              const check = () => {
                finalizeJapaneseInput(input);
                const typed = input.value.trim();
                if (!typed) { toast("আগে Japanese spelling লিখুন।"); return; }
                const mode = state.spellingMode === "mixed" ? ["meaning", "audio", "pron"][(card.id + state.spellingIndex) % 3] : state.spellingMode;
                state.spellingResult = recordOfflineSpelling(card, typed, mode, state.spellingHint);
                refresh(); showView("spelling");
              };
              const next = () => {
                state.spellingIndex++; state.spellingResult = null; state.spellingHint = false;
                if (state.spellingIndex >= state.spellingSession.length) {
                  state.spellingSession = null; toast("Spelling session complete ✓"); refresh(); showView("spelling");
                } else renderSpelling();
              };
              $("#checkSpell").onclick = check;
              input.onkeydown = e => { if (e.key === "Enter") check(); };
              $("#spellHint").onclick = () => { state.spellingHint = true; renderSpelling(); };
              $("#spellWordAudio").onclick = () => speak(card.spelling_text, .88);
              const a = $("#spellAudio"); if (a) a.onclick = () => speak(card.spelling_text, .88);
              $("#spellShow").onclick = () => { state.spellingResult = { is_correct: false, typed: input.value || "", expected: card.spelling_text, shown: true }; state.spellingHint = true; renderSpelling(); };
              $("#skipSpell").onclick = () => next();
              const r = $("#retrySpell"); if (r) r.onclick = () => { state.spellingResult = null; state.spellingHint = true; renderSpelling(); };
              const n = $("#nextSpell"); if (n) n.onclick = () => next();
            };

            // ---------- SRS recall privacy ----------
            srsPrompt = function(card) {
              const phase = card.srs?.phase || "learn";
              if (phase === "use") return { title: "USE", prompt: `「${card.japanese}」 ব্যবহার করে একটি ছোট Japanese sentence লিখুন বা বলুন।`, typed: true, use: true };
              return { title: phase === "review" ? "REVIEW" : phase === "learn" ? "LEARN / RECALL" : "RECALL", prompt: `「${card.japanese}」 দেখে অর্থ ও উচ্চারণ মনে করুন। Natural sentence clue হিসেবে থাকবে। তারপর Reveal করুন।` };
            };

            offlineSrsCard = function(card) {
              const phase = card.srs?.phase || "learn", p = srsPrompt(card), r = state.srsRevealed;
              return `<div class="srs-study-card"><div class="srs-card-top"><div><span class="srs-phase phase-${phase}">${p.title}</span><span class="srs-due">${card.preview ? "Preview · " : ""}${dueText(card.srs?.due_at)}</span></div><div class="srs-counter">${state.srsIndex + 1}/${state.srsSession.length}</div></div><div class="srs-prompt">${esc(p.prompt)}</div>
                <div class="srs-learn-box"><div class="jp-word">${esc(card.japanese)}</div><div class="example" style="margin-top:12px">${esc(card.example.jp)}</div><button class="btn soft" id="${phase === "learn" ? "sla" : "sra"}" style="margin-top:10px">🔊 Japanese Voice</button></div>
                ${p.typed ? `<div class="srs-answer-row"><input id="srsAnswer" class="search-input" lang="ja" data-jp-input="1" placeholder="${p.use ? "নিজের Japanese sentence লিখুন…" : "Japanese answer লিখুন…"}"><button class="btn soft" id="micAnswer">🎙 Speak</button></div>` : ""}
                ${!r ? `<button class="btn primary" id="revealSrs">Reveal বাংলা অর্থ + উচ্চারণ</button>` : ""}
                ${r ? `<div class="srs-reveal"><div class="eyebrow">ANSWER</div><div class="jp-word">${esc(card.japanese)}</div><div class="meaning">${esc(card.bangla_meaning)}</div><div class="pron">উচ্চারণ: ${esc(card.pronunciation_bn)}</div><div class="example">${esc(card.example.jp)}</div><div class="translation">${esc(card.example.bn)}</div></div>` : ""}
                ${r ? `<div class="srs-rating"><button data-rate="again" class="rate-again">Again<small>10 min</small></button><button data-rate="hard" class="rate-hard">Hard<small>shorter</small></button><button data-rate="good" class="rate-good">Good<small>normal</small></button><button data-rate="easy" class="rate-easy">Easy<small>longer</small></button></div>` : ""}</div>`;
            };

            // ---------- Listening up to 3×, strict serial sequence ----------
            renderListening = function() {
              const L = state.content, dlg = L.dialogue_extended || L.dialogue, text = L.reading_extended || L.reading;
              const readChunks = jpSentences(text), vocabLines = state.vocab.filter(v => v.example?.jp).slice(0, 20).map(v => v.example.jp), core = dlg.map(x => x[1]);
              const longMix = [...core, ...readChunks, ...vocabLines], shadow = [...core.flatMap(x => [x, x, x]), ...readChunks.flatMap(x => [x, x]), ...vocabLines.slice(0, 10)], marathon = [...longMix, ...longMix, ...longMix];

              $("#view-listening").innerHTML = `<div class="section-head"><div><div class="eyebrow">LISTENING + SHADOWING</div><h2>Natural Japanese Listening Lab</h2><p>Pre-generated neural audio · এক সময়ে একটিই line বাজবে।</p></div></div><div class="listening-modes"><button class="listening-mode-card" id="listenCore"><b>01</b><strong>Extended Listening</strong><span>≈ 4–6 min</span><small>conversation + reading</small></button><button class="listening-mode-card" id="listenShadow"><b>02</b><strong>Shadowing Marathon</strong><span>≈ 8–10 min</span><small>strict single-stream sequence</small></button><button class="listening-mode-card featured" id="listenMarathon"><b>03</b><strong>Intensive Marathon</strong><span>≈ 12–15+ min</span><small>conversation + reading + sentences</small></button></div><div class="listen-grid"><div class="listen-stage"><h3>${esc(L.scenario)}</h3><div class="wave" id="wave">${"<i></i>".repeat(22)}</div><div class="toolbar listen-speeds"><button class="btn glass" id="lb">0.78×</button><button class="btn glass" id="ln">0.90×</button><button class="btn glass" id="lf">1×</button><button class="btn glass" id="l15">1.5×</button><button class="btn glass" id="l2">2×</button><button class="btn glass" id="l3">3×</button><button class="btn red" id="lstop">■ STOP</button></div><div class="shadow-step single-stream-note"><b>✓ Single Voice</b> — একটি line পুরো শেষ হওয়ার পরেই পরের line শুরু হবে।</div><div class="shadow-step"><b>1</b> — transcript ছাড়া শুনুন।</div><div class="shadow-step"><b>2</b> — key words ধরুন।</div><div class="shadow-step"><b>3</b> — audio-এর পরে shadow করুন।</div></div><div class="card transcript-card"><div class="eyebrow">TRANSCRIPT</div><div id="tr" style="display:none;max-height:560px;overflow:auto">${dlg.map(x => `<p><b>${x[0]}：</b><span class="jp">${esc(x[1])}</span><br><span class="meta meaning-sensitive">${esc(x[2])}</span></p>`).join("")}<hr style="border:0;border-top:1px solid var(--line)"><div class="reading-jp" style="font-size:15px">${highlight(text)}</div></div><button class="btn soft" id="tt">👁 Transcript</button><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>Dictation</h3><textarea id="longDictation" rows="8" lang="ja" data-jp-input="1" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:11px" placeholder="শুনে Japanese লিখুন…"></textarea></div></div><div class="section-head"><div><h3>Quick Streams</h3></div><div class="toolbar"><button class="btn primary" id="vstream">▶ Words</button><button class="btn red" id="sstream">▶ 20 Sentences</button></div></div>`;

              const wave = on => $("#wave")?.classList.toggle("playing", on);
              const play = (lines, pause, rate) => { stopSpeech(); wave(true); sequence(lines, pause, rate, () => wave(false)); };
              $("#lb").onclick = () => play(core, 620, .78); $("#ln").onclick = () => play(core, 520, .90); $("#lf").onclick = () => play(core, 430, 1);
              $("#l15").onclick = () => play(core, 320, 1.5); $("#l2").onclick = () => play(core, 230, 2); $("#l3").onclick = () => play(core, 150, 3);
              $("#listenCore").onclick = () => play([...core, ...readChunks], 520, .88); $("#listenShadow").onclick = () => play(shadow, 900, .82); $("#listenMarathon").onclick = () => play(marathon, 720, .86);
              $("#lstop").onclick = () => { stopSpeech(); wave(false); };
              $("#tt").onclick = () => { const t = $("#tr"), h = t.style.display === "none"; t.style.display = h ? "block" : "none"; };
              $("#vstream").onclick = () => play(state.vocab.map(v => v.tts_text).filter(Boolean), 400, .84); $("#sstream").onclick = () => play(vocabLines, 620, .88);
              activateJapaneseInputs($("#view-listening"));
              const key = `n5_offline_listen_dictation_${state.lesson}`, ta = $("#longDictation");
              ta.value = localStorage.getItem(key) || "";
              ta.oninput = () => { if (jpInputMode() !== "native") transformJpInput(ta, false); localStorage.setItem(key, ta.value); };
            };

            // ---------- Clean visual layer ----------
            const style = document.createElement("style");
            style.textContent = `
              :root{--radius:18px;--shadow:0 12px 34px rgba(16,34,56,.08)}
              .topbar{min-height:72px;padding:10px 22px}.layout{grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 72px)}
              .sidebar{top:72px;height:calc(100vh - 72px);padding:14px 12px 22px}.side-section{padding:10px 7px 14px;margin-bottom:7px}
              .nav{gap:3px}.nav button{padding:9px 10px;border-radius:10px;font-size:13px}.main{padding:22px 24px 44px}
              .hero{padding:26px;border-radius:24px}.hero h1{font-size:30px}.hero p{line-height:1.6}.pills{margin-top:13px}.pill{padding:5px 9px}
              .stats{gap:10px}.stat{padding:14px;border-radius:15px}.stat strong{font-size:22px}.section-head{margin:23px 0 11px}
              .card{padding:16px;border-radius:17px;box-shadow:0 5px 18px rgba(20,45,66,.045)}.clean-flow .card p{margin-bottom:0;color:var(--muted)}
              .lesson-grid{gap:8px}.lesson-tile{min-height:74px;padding:10px;border-radius:13px}.lesson-tile.current{background:#fff7f7}
              .vocab-list{gap:8px}.vocab-card{grid-template-columns:minmax(170px,.8fr) minmax(260px,1.45fr) auto;padding:13px 14px;border-radius:15px;gap:13px}
              .vocab-card.mastered-card{border-color:#b9dccd;background:linear-gradient(90deg,#f8fffb,#fff)}.verify-chip,.curated-badge{display:none!important}
              .actions{gap:4px}.icon{width:36px;height:36px;border-radius:10px}.srs-study-card,.spell-study-card{max-width:920px;margin-inline:auto}
              .listening-modes{gap:10px}.listening-mode-card{min-height:118px;padding:16px}.listen-grid{gap:12px}.listen-stage{padding:20px;border-radius:20px}
              .listen-speeds{gap:5px}.listen-speeds .btn{padding:8px 10px}.single-stream-note{border-color:#7ac7a8!important;background:rgba(36,115,90,.18)!important}
              .instant-voice-note{font-size:9px;line-height:1.45;color:#42665a;margin-top:6px}
              @media(max-width:1100px){.lesson-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.vocab-card{grid-template-columns:1fr 1.35fr auto}}
              @media(max-width:820px){.main{padding:15px 12px 86px}.hero{padding:20px;border-radius:20px}.hero h1{font-size:25px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3,.grid-2,.listen-grid{grid-template-columns:1fr}.vocab-card{grid-template-columns:1fr;padding:14px}.actions{justify-content:flex-start}.listening-modes{grid-template-columns:1fr}.listen-speeds{display:flex;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.listen-speeds .btn{flex:0 0 auto}}
            `;
            document.head.appendChild(style);

            // Apply all replacements once. No MutationObserver, no stacked patch loops.
            refresh();
            showView(state.view || "overview", { keepScroll: true, instant: true });

            console.info("N5 Clean App v26 loaded — no MutationObserver patches.");
          })();

          JAVASCRIPT

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -e

          cp index.html _site/index.html
          cp index.html _site/404.html
          cp .nojekyll _site/.nojekyll 2>/dev/null || true

          cp _build/audio-manifest.js _site/audio-manifest-v26.js
          cp _build/instant-audio-v26.js _site/instant-audio-v26.js
          cp _build/app-clean-v26.js _site/app-clean-v26.js

          # Copy only generated MP3 files — no neural model ships to the phone.
          cp _audio_cache/*.mp3 _site/audio/

          python - <<'PYTHON'
          from pathlib import Path

          for filename in ["_site/index.html", "_site/404.html"]:
              path = Path(filename)
              html = path.read_text(encoding="utf-8")

              injection = """
              <script src="./audio-manifest-v26.js"></script>
              <script src="./instant-audio-v26.js"></script>
              <script src="./app-clean-v26.js"></script>
              """

              if "app-clean-v26.js" not in html:
                  html = html.replace("</body>", injection + "\n</body>")

              html = html.replace(
                  "GitHub Single File · Mobile First · Romaji→Kana",
                  "Clean v26 · Instant Audio · Mobile First"
              )
              html = html.replace(
                  "<title>N5 Natural Japanese Studio — GitHub Single File</title>",
                  "<title>N5 Natural Japanese Studio — Clean v26</title>"
              )

              path.write_text(html, encoding="utf-8")
          PYTHON

      - name: Verify clean v26 deployment
        shell: bash
        run: |
          set -e
          test -f _site/index.html
          test -f _site/audio-manifest-v26.js
          test -f _site/instant-audio-v26.js
          test -f _site/app-clean-v26.js
          test -d _site/audio
          test "$(find _site/audio -name '*.mp3' | wc -l)" -gt 1500
          test "$(find _site/audio -name 'lesson-*.json' | wc -l)" -eq 25
          grep -q "app-clean-v26.js" _site/index.html
          grep -q "Critical: resolve only after THIS clip actually ends" _site/instant-audio-v26.js
          grep -q 'setLesson(Number(b.dataset.jump), "vocab")' _site/app-clean-v26.js
          grep -q 'id="skipSpell"' _site/app-clean-v26.js
          grep -q 'id="l3"' _site/app-clean-v26.js
          grep -q 'Reveal বাংলা অর্থ + উচ্চারণ' _site/app-clean-v26.js
          if grep -q 'new MutationObserver' _site/app-clean-v26.js; then
            echo "ERROR: v26 clean app must not create MutationObserver patches"
            exit 1
          fi
          node --check _site/instant-audio-v26.js
          node --check _site/app-clean-v26.js
          echo "v26 QA PASS"
          echo "MP3 clips: $(find _site/audio -name '*.mp3' | wc -l)"
          echo "Published site size:"
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
