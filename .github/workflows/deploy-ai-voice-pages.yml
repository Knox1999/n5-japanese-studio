            };
          
            function allVocab() {
              try { return window.N5_OFFLINE_DATA?.vocabulary || []; }
              catch { return []; }
            }
          
            function progressMap() {
              try { return state?.progress || {}; }
              catch { return {}; }
            }
          
            function totalMastered() {
              const p = progressMap();
              return allVocab().reduce((n, v) => n + (p[v.id] ? 1 : 0), 0);
            }
          
            function lessonMastery(lesson) {
              const rows = allVocab().filter(v => Number(v.lesson) === Number(lesson));
              const p = progressMap();
              const mastered = rows.filter(v => p[v.id]).length;
              return { lesson:Number(lesson), total:rows.length, mastered, pct:rows.length ? Math.round(mastered * 100 / rows.length) : 0 };
            }
          
            function allLessonMastery() {
              return Array.from({length:25}, (_, i) => lessonMastery(i + 1));
            }
          
            function spellingHealth() {
              try {
                const rows = Array.isArray(state?.spelling) ? state.spelling : [];
                const correct = rows.filter(x => x.correct).length;
                return { attempts:rows.length, correct, accuracy:rows.length ? Math.round(correct * 100 / rows.length) : 0 };
              } catch { return {attempts:0,correct:0,accuracy:0}; }
            }
          
            function srsHealth() {
              const vocabIds = new Set(allVocab().map(v => Number(v.id)));
              const srs = (() => { try { return state?.srs || {}; } catch { return {}; } })();
              const now = Date.now();
              let studied = 0, due = 0, mature = 0, learning = 0, growing = 0;
          
              for (const [id, st] of Object.entries(srs)) {
                if (!vocabIds.has(Number(id)) || !st) continue;
                studied += 1;
                const dueAt = st.due_at ? new Date(st.due_at).getTime() : Infinity;
                const isDue = Number.isFinite(dueAt) && dueAt <= now;
                const isMature = Number(st.interval_days || 0) >= 7 || Number(st.repetitions || 0) >= 5;
                if (isDue) due += 1;
                if (isMature) mature += 1;
                else if (Number(st.interval_days || 0) < 1 || ["learn","recall","use"].includes(st.phase)) learning += 1;
                else growing += 1;
              }
          
              const total = allVocab().length;
              const fresh = Math.max(0, total - studied);
              return { total, studied, due, mature, learning, growing, fresh };
            }
          
            function mockHealth() {
              try {
                const history = Array.isArray(state?.history) ? state.history : [];
