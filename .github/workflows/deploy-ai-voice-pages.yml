      - name: Build KanjiVG stroke-order assets for KLC
        shell: bash
        run: |
          set -e
          rm -rf _kanjivg
          git clone --depth 1 https://github.com/KanjiVG/kanjivg.git _kanjivg
          mkdir -p _site/assets/strokes

          python - <<'PYTHON'
          import json, re, shutil
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'window\.KLC_TREE_DATA\s*=\s*(\{.*?\});\s*</script>', html, re.S)
          if not m:
              raise SystemExit("Could not find KLC_TREE_DATA")
          data = json.loads(m.group(1))
          nodes = data.get("nodes") or []
          src_dir = Path("_kanjivg/kanji")
          out_dir = Path("_site/assets/strokes")
          index = {}
          missing = []

          for node in nodes:
              if not isinstance(node, list) or len(node) < 2:
                  continue
              ch = str(node[1] or "").strip()
              if len(ch) != 1:
                  continue
              cp = ord(ch)
              if not (0x3400 <= cp <= 0x9FFF):
                  continue
              filename = f"{cp:05x}.svg"
              src = src_dir / filename
              if src.exists():
                  shutil.copy2(src, out_dir / filename)
                  index[ch] = filename
              else:
                  missing.append(ch)

          (out_dir / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          copying = Path("_kanjivg/COPYING")
          if copying.exists():
              shutil.copy2(copying, out_dir / "KANJIVG_LICENSE.txt")
          (out_dir / "ATTRIBUTION.txt").write_text(
              "KanjiVG vector graphics — copyright Ulrich Apel and contributors. "
              "Licensed under CC BY-SA 3.0. https://github.com/KanjiVG/kanjivg\n",
              encoding="utf-8",
          )
          print("KanjiVG copied:", len(index), "missing:", len(missing))
          if len(index) < 1800:
              raise SystemExit(f"Too few KanjiVG assets copied: {len(index)}")
          PYTHON

          rm -rf _kanjivg

      - name: Build Top Notch Product UI v40
        shell: bash
        run: |
          mkdir -p _build/v40
          cat > _build/v40/top-notch-v40.css <<'CSS'
          /* N5 Natural Japanese Studio — Top Notch Product UI v40
             Production visual system: Japanese calm premium + learning intelligence. */
          
          :root{
            --v40-ink:#142638;
            --v40-ink-2:#20384b;
            --v40-navy:#10283f;
            --v40-navy-2:#183b56;
            --v40-paper:#f6f3ed;
            --v40-paper-2:#fbf9f5;
            --v40-card:#fffdfa;
            --v40-line:#e7e2da;
            --v40-muted:#687887;
            --v40-muted-2:#8a969f;
            --v40-red:#b9474d;
            --v40-red-dark:#9d343b;
            --v40-sakura:#d97f90;
            --v40-sakura-soft:#fff1f3;
            --v40-green:#557866;
            --v40-green-soft:#edf5f0;
            --v40-blue:#557a9f;
            --v40-blue-soft:#edf4fa;
            --v40-gold:#a77c32;
            --v40-gold-soft:#fbf3e2;
            --v40-purple:#6f6290;
            --v40-purple-soft:#f2eff8;
            --v40-shadow-1:0 6px 18px rgba(20,38,56,.045);
            --v40-shadow-2:0 14px 34px rgba(20,38,56,.075);
            --v40-shadow-3:0 24px 64px rgba(20,38,56,.11);
            --v40-r-sm:12px;
            --v40-r-md:18px;
            --v40-r-lg:24px;
            --v40-r-xl:32px;
            --v40-ease:cubic-bezier(.2,.8,.2,1);
