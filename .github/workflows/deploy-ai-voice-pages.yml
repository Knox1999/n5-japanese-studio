              if (dock) {
                const spell = q('[data-mobile-view="spelling"]', dock);
                if (spell) { spell.dataset.mobileView = "srs"; spell.innerHTML = `<span>${icon("srs")}</span><b>SRS</b>`; }
              }
              updateShell();
            }
          
            function updateShell() {
              try {
                const lesson = Number(state?.lesson || q("#lessonSelect")?.value || 1);
                const chip = q("#v36LessonChip");
                if (chip) chip.innerHTML = `<span>CURRENT</span><b>Lesson ${String(lesson).padStart(2,"0")}</b>`;
                const focus = q("#v36FocusLesson"); if (focus) focus.textContent = `L${String(lesson).padStart(2,"0")}`;
                const rows = Array.isArray(state?.vocab) ? state.vocab : [];
                const done = rows.filter(v => v.mastered).length;
                const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
                const bar = q("#v36DailyFocus .v36-focus-bar i"); if (bar) bar.style.width = `${pct}%`;
              } catch {}
            }
          
            function installOverview() {
              if (typeof renderOverview !== "function") return;
              renderOverview = function() {
                const L = state.content || {};
                const rows = state.vocab || [];
                const done = rows.filter(v => v.mastered).length;
                const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
                const avg = state.history?.length ? Math.round(state.history.reduce((a, x) => a + Number(x.score || 0), 0) / state.history.length) : 0;
                const srs = typeof offlineSrsSummary === "function" ? offlineSrsSummary(state.lesson) : { due:0, new:0 };
                const lessons = typeof lessonSummary === "function" ? lessonSummary() : [];
                const title = L.title || `Lesson ${state.lesson}`;
                const scenario = L.scenario || "Natural Japanese study";
          
                q("#view-overview").innerHTML = `
