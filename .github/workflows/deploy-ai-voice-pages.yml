            function installShell() {
              const sidebar = q("#studySidebar");
              const topbar = q(".topbar");
              const nav = q("#nav");
              const dock = q("#mobileDock");
              if (!sidebar || !topbar || !nav) return;
          
              q("#v35SideBrand")?.remove();
              q("#v35TopSearch")?.remove();
              q("#v35LessonChip")?.remove();
              q("#v35DailyFocus")?.remove();
          
              if (!q("#v36SideBrand")) sidebar.insertAdjacentHTML("afterbegin", `
                <div class="v36-side-brand" id="v36SideBrand">
                  <div class="v36-brand-mark" aria-hidden="true"><span>日</span></div>
                  <div><strong>N5 Natural Japanese</strong><span>Study Studio · JLPT N5</span></div>
                </div>`);
          
              if (!q("#v36TopSearch")) {
                const actions = q(".top-actions", topbar);
                const search = document.createElement("button");
                search.type = "button";
                search.id = "v36TopSearch";
                search.className = "v36-top-search";
                search.innerHTML = `${icon("search")}<span>Search vocabulary, grammar, kanji…</span><kbd>Ctrl K</kbd>`;
                search.onclick = () => q("#searchBtn")?.click();
                topbar.insertBefore(search, actions || null);
              }
          
              if (!q("#v36LessonChip")) q(".top-actions", topbar)?.insertAdjacentHTML("afterbegin", `<div class="v36-lesson-chip" id="v36LessonChip"><span>CURRENT</span><b>Lesson</b></div>`);
          
              const navLabels = {
                overview:["home","Dashboard"], vocab:["vocab","Vocabulary"], spelling:["vocab","Spelling"], srs:["srs","SRS (Recall)"],
                conversation:["vocab","Conversation"], reading:["vocab","Reading"], listening:["listen","Listening"], grammar:["quiz","Grammar"],
                kanji:["kanji","Kanji Tree (KLC)"], mock:["quiz","Mock Test"], history:["quiz","Test History"]
              };
              qa("button[data-view]", nav).forEach(btn => {
                const view = btn.dataset.view;
                const label = navLabels[view];
                if (!label) return;
                const badgeText = view === "spelling" ? (q("#spellingWrongBadge", btn)?.textContent || "0") : view === "srs" ? (q("#srsDueBadge", btn)?.textContent || "0") : "";
                const badge = view === "spelling" ? `<b id="spellingWrongBadge" class="nav-badge">${safeEsc(badgeText)}</b>` : view === "srs" ? `<b id="srsDueBadge" class="nav-badge">${safeEsc(badgeText)}</b>` : "";
                btn.innerHTML = `<span class="v36-nav-icon">${icon(label[0])}</span><span class="v36-nav-label">${label[1]}</span>${badge}`;
