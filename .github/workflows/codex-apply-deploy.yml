name: Codex Apply Free Voice Deployment

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  apply-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared production changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --exclude=.github/workflows/deploy-pages.yml 0001-feat-apply-final-production-and-fix-Pages-build.patch
          git apply --exclude=.github/workflows/deploy-pages.yml 0002-feat-use-free-browser-Japanese-voices.patch
          rm 0001-feat-apply-final-production-and-fix-Pages-build.patch
          rm 0002-feat-use-free-browser-Japanese-voices.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish production with free Japanese browser voices"
          git push origin HEAD:main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repository hygiene and reproducible lockfile
        shell: bash
        run: |
          set -e
          python scripts/repo_hygiene.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Build and validate study data
        run: |
          python scripts/build_klc_from_csv.py
          python scripts/build_data.py
          python scripts/qa_production.py --prebuild

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        run: npm run lint:types

      - name: Verify zero-cost Japanese voice runtime
        run: grep -q "web-speech-api-ja-JP" lib/audio.ts

      - name: Build KanjiVG stroke-order library
        shell: bash
        run: |
          rm -rf _kanjivg
          git clone --depth 1 https://github.com/KanjiVG/kanjivg.git _kanjivg
          python scripts/build_strokes.py

      - name: Build static Next.js site
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Generate offline app shell
        run: |
          python scripts/build_sw.py out
          touch out/.nojekyll

      - name: Final production QA
        run: python scripts/qa_production.py --postbuild

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
