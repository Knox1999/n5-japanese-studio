name: One-time Repository Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete release clutter
        shell: bash
        run: |
          set -e

          # Old release reports / manifests / setup notes from V41–V50.
          rm -f V[0-9]*_*.txt
          rm -f V[0-9]*_*.json
          rm -f V[0-9]*_*.md

          # Old one-off setup/test artifacts that are not referenced by production code.
          rm -f GITHUB_PAGES_SETUP_BN.txt
          rm -f Minna_Renshu_B_QA_Package_L1-L25_v2.zip
          rm -f natural-voice-test.html
          rm -f 404.html

          # Obsolete stylesheet: current layout does not import v45-academy.scss.
          rm -f styles/v45-academy.scss

          # Old version-specific QA has been replaced by qa_production.py.
          rm -f scripts/qa_v42.py

          # This workflow is intentionally one-time; remove itself after use.
          rm -f .github/workflows/cleanup-repo.yml

      - name: Commit cleaned repository
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean obsolete release artifacts"
          git push origin HEAD:main
