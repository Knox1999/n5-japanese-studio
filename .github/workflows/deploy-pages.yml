name: Deploy The Nihongo Vibes — Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  KANJIVG_COMMIT: 61e39cf

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Repository hygiene
        shell: bash
        run: |
          set -e
          python scripts/repo_hygiene.py

      - name: Build and validate study data
        run: |
          python scripts/build_klc_from_csv.py
          python scripts/build_data.py
          python scripts/qa_production.py --prebuild

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Type-check frontend
        run: npm run lint:types

      - name: Lint frontend
        run: npm run lint

      - name: Verify zero-cost Japanese voice runtime
        run: grep -q "web-speech-api-ja-JP" lib/audio.ts

      - name: Build KanjiVG stroke-order library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _kanjivg
          curl --fail --location --retry 3 "https://github.com/KanjiVG/kanjivg/archive/${KANJIVG_COMMIT}.tar.gz" \
            | tar -xz --strip-components=1 -C _kanjivg
          python scripts/build_strokes.py

      - name: Build static Next.js site
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Generate offline app shell
        run: |
          python scripts/build_sw.py out
          touch out/.nojekyll

      - name: Final production QA
        run: python scripts/qa_production.py --postbuild

      - name: Install browser for responsive regression tests
        run: npx playwright install --with-deps chromium

      - name: Responsive and accessibility regression tests
        run: npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
