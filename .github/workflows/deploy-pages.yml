name: Deploy The Nihongo Vibes — Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and validate study data
        run: |
          python scripts/build_klc_from_csv.py
          python scripts/build_data.py
          python scripts/qa_production.py --prebuild

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check frontend
        run: npm run lint:types

      - name: Restore V57 neural audio cache
        uses: actions/cache@v4
        with:
          path: _audio_cache
          key: n5-v57-edge-ja-${{ hashFiles('source/data/studio.json', 'source/data/grammar-visual.json', 'scripts/generate_audio.py', 'scripts/extract_audio_texts.py') }}
          restore-keys: |
            n5-v57-edge-ja-
          save-always: true

      - name: Install V57 Japanese neural TTS
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "edge-tts>=7.0,<8.0"

      - name: Generate young-adult Japanese neural audio
        env:
          N5_TTS_CONCURRENCY: "4"
        run: |
          python scripts/extract_audio_texts.py
          python scripts/generate_audio.py
          python scripts/build_audio_manifest.py

      - name: Build KanjiVG stroke-order library
        shell: bash
        run: |
          rm -rf _kanjivg
          git clone --depth 1 https://github.com/KanjiVG/kanjivg.git _kanjivg
          python scripts/build_strokes.py

      - name: Build static Next.js site
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Final production QA
        run: |
          touch out/.nojekyll
          python scripts/qa_production.py --postbuild

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
