name: Verify and Deploy The Nihongo Vibes

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KANJIVG_COMMIT: 61e39cf

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: production-verification
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Repository hygiene
        shell: bash
        run: |
          set -e
          python scripts/repo_hygiene.py

      - name: Build and validate study data
        run: |
          python scripts/build_klc_from_csv.py
          python scripts/build_data.py
          python scripts/qa_production.py --prebuild

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Type-check frontend
        run: npm run lint:types

      - name: Lint frontend
        run: npm run lint

      - name: Verify zero-cost Japanese voice runtime
        run: grep -q "web-speech-api-ja-JP" lib/audio.ts

      - name: Restore static Japanese neural-audio cache
        uses: actions/cache@v4
        with:
          path: _audio_cache
          key: n5-v61-edge-ja-${{ hashFiles('source/data/studio.json', 'source/data/grammar-visual.json', 'scripts/generate_audio.py', 'scripts/extract_audio_texts.py') }}
          restore-keys: |
            n5-v61-edge-ja-
            n5-v58-edge-ja-
            n5-v57-edge-ja-
          save-always: true

      - name: Install static Japanese neural-TTS toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "edge-tts>=7.0,<8.0"

      - name: Generate and verify static Japanese audio
        env:
          N5_TTS_CONCURRENCY: '4'
        run: |
          python scripts/extract_audio_texts.py
          python scripts/generate_audio.py
          python scripts/build_audio_manifest.py
          python scripts/qa_audio_v7.py

      - name: Build KanjiVG stroke-order library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _kanjivg
          curl --fail --location --retry 3 "https://github.com/KanjiVG/kanjivg/archive/${KANJIVG_COMMIT}.tar.gz" \
            | tar -xz --strip-components=1 -C _kanjivg
          python scripts/build_strokes.py

      - name: Build static Next.js site
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Generate offline app shell
        run: |
          python scripts/build_sw.py out
          touch out/.nojekyll

      - name: Final production QA
        run: python scripts/qa_production.py --postbuild

      - name: Install browsers for responsive regression tests
        run: npx playwright install --with-deps chromium webkit

      - name: Responsive and accessibility regression tests
        run: npm run test:e2e

      - name: Upload verified static export
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: verified-static-export
          path: ./out
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy-github-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download verified static export
        uses: actions/download-artifact@v4
        with:
          name: verified-static-export
          path: ./out

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
